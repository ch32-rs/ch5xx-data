- name: UART0
  address: 0x40003000
  registers:
    kind: uart
    version: ch585
    block: UART_FULL
  remap:
    register: PIN_ALTERNATE
    field: PIN_UART0
  interrupts:
    - signal: GLOBAL
      interrupt: UART0
  # DSR/DTR have a second selector, PIN_MODEM, distinct from
  # PIN_UART0 above. Their remap=1 rows record that alternate
  # mapping; a driver must select PIN_MODEM for those two signals.
  pins:
    - pin: PB4
      signal: RXD
      remap: 0
    - pin: PA15
      signal: RXD
      remap: 1
    - pin: PB7
      signal: TXD
      remap: 0
    - pin: PA14
      signal: TXD
      remap: 1
    - pin: PB0
      signal: CTS
    - pin: PB6
      signal: RTS
    - pin: PB5
      signal: DTR
      remap: 0
    - pin: PB15
      signal: DTR
      remap: 1
    - pin: PB1
      signal: DSR
      remap: 0
    - pin: PB14
      signal: DSR
      remap: 1
    - pin: PB3
      signal: DCD
    - pin: PA2
      signal: RI

