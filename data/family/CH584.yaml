# CH584. The CH585 datasheet (V1.6) says CH584 is CH585 with the USBHS and
# SPI1 modules removed and 96KB of SRAM, so this is data/family/CH585.yaml
# minus those two peripherals. LCD stays: chapter 13 covers both chips.
#
# Register blocks are shared with CH585, including SYS. The clock and pin
# fields that gate USBHS and SPI1 are part of the same registers and are
# left in place.

# Pin muxing and interrupt bindings follow CH585DS1 V1.6 tables 1-1,
# 1-3, 3-1 and 7-8; this part uses the same die pads and remap
# register, with the peripheral removals listed above.

- name: SYS
  address: 0x40001000
  registers:
    kind: sys
    version: ch585
    block: SYS
  interrupts:
    - signal: BAT
      interrupt: WDOG_BAT

- name: RTC
  address: 0x40001000
  registers:
    kind: rtc
    version: ch585
    block: RTC
  interrupts:
