# CH584. The CH585 datasheet (V1.6) says CH584 is CH585 with the USBHS and
# SPI1 modules removed and 96KB of SRAM, so this is data/family/CH585.yaml
# minus those two peripherals. LCD stays: chapter 13 covers both chips.
#
# Register blocks are shared with CH585, including SYS. The clock and pin
# fields that gate USBHS and SPI1 are part of the same registers and are
# left in place.


- name: SYS
  address: 0x40001000
  registers:
    kind: sys
    version: ch585
    block: SYS

- name: RTC
  address: 0x40001000
  registers:
    kind: rtc
    version: ch585
    block: RTC

- name: System_control
  address: 0x40001000
  registers:
    kind: system_control
    version: ch585
    block: System_control

- name: TouchKey
