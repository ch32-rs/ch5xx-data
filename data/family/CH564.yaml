# CH564. From svd/fixed/ch564.svd. Peripheral base map is 0x40400000 (ETH
# stays at 0x40028xxx). SYS split into SYS / System_control / GPIO / SLV.

- name: SYS
  address: 0x40400000
  registers:
    kind: sys
    version: ch564
    block: SYS

- name: System_control
  address: 0x40400000
  registers:
    kind: system_control
    version: ch564
    block: System_control

