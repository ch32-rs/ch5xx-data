# CH573 / CH571. Drafted from svd/fixed/ch57xxx.svd, then the SYS blob at
# 0x40001000 was split into SYS / RTC / System_control / TouchKey / ADC /
# GPIO. gpio / pwmx / rtc layouts match CH583 and live as version ch573
# (smaller chip number). CH571 shares this full list for now; Studio claims
# feature cuts without a separate register map, so memory differs only.

- name: SYS
  address: 0x40001000
  registers:
    kind: sys
    version: ch573
    block: SYS

- name: RTC
  address: 0x40001000
  registers:
    kind: rtc
    version: ch573
    block: RTC

- name: System_control
  address: 0x40001000
  registers:
    kind: system_control
    version: ch573
    block: System_control

- name: TouchKey
  address: 0x40001000
  registers:
    kind: touchkey
    version: ch573
    block: TouchKey

- name: ADC
  address: 0x40001000
  registers:
    kind: adc
    version: ch573
    block: ADC

- name: GPIO
  address: 0x40001000
  registers:
    kind: gpio
    version: ch573
    block: GPIO

- name: TMR0
  address: 0x40002000
  registers:
    kind: tmr
    version: ch573
    block: TMR_NODMA

- name: TMR1
  address: 0x40002400
  registers:
    kind: tmr
    version: ch573
    block: TMR_FULL

- name: TMR2
  address: 0x40002800
  registers:
    kind: tmr
    version: ch573
    block: TMR_FULL

- name: TMR3
  address: 0x40002C00
  registers:
    kind: tmr
    version: ch573
    block: TMR_NODMA

- name: UART0
  address: 0x40003000
  registers:
    kind: uart
    version: ch573
    block: UART_FULL

- name: UART1
  address: 0x40003400
  registers:
    kind: uart
    version: ch573
    block: UART_NOMODEM

- name: UART2
  address: 0x40003800
  registers:
    kind: uart
    version: ch573
    block: UART_NOMODEM

- name: UART3
  address: 0x40003C00
  registers:
    kind: uart
    version: ch573
    block: UART_NOMODEM

- name: SPI0
  address: 0x40004000
  registers:
    kind: spi
    version: ch573
    block: SPI_FULL

- name: PWMx
  address: 0x40005000
  registers:
    kind: pwmx
    version: ch573
    block: PWMx

- name: USB
  address: 0x40008000
  registers:
    kind: usb
    version: ch573
    block: USB

# Placeholder: vendor SVD lists BLE with no registers.
- name: BLE
  address: 0x4000C000

- name: PFIC
  address: 0xE000E000
  registers:
    kind: pfic
    version: ch573
    block: PFIC

- name: Systick
  address: 0xE000F000
  registers:
    kind: systick
    version: ch573
    block: Systick
