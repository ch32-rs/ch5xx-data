# CH569 / CH565. From svd/fixed/ch56xxx.svd after SYS → SYS / System_control /
# GPIO split. USBSS / SERDES / ETH are 0-register placeholders.

- name: SYS
  address: 0x40001000
  registers:
    kind: sys
    version: ch569
    block: SYS

- name: System_control
  address: 0x40001000
  registers:
    kind: system_control
    version: ch569
    block: System_control

- name: GPIO
  address: 0x40001000
  registers:
    kind: gpio
    version: ch569
    block: GPIO

- name: TMR0
