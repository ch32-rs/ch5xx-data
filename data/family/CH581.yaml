# CH581. The CH585 die with SPI1, USBHS and LCD removed, from the CH581 SFR
# header, so this is data/family/CH585.yaml minus those three peripherals.
# CH584 keeps LCD; it has its own list in data/family/CH584.yaml.
#
# Register blocks are shared with CH585 except SYS, which loses the clock,
# pin and power fields that only gate the removed peripherals. See
# data/registers/sys_ch581.yaml.


- name: SYS
  address: 0x40001000
  registers:
    kind: sys
    version: ch581
    block: SYS

- name: RTC
  address: 0x40001000
  registers:
    kind: rtc
    version: ch585
    block: RTC

- name: System_control
  address: 0x40001000
  registers:
    kind: system_control
    version: ch585
    block: System_control

- name: TouchKey
  address: 0x40001000
  registers:
    kind: touchkey
    version: ch585
    block: TouchKey

- name: ADC
  address: 0x40001000
  registers:
    kind: adc
    version: ch585
    block: ADC

- name: GPIO
  address: 0x40001000
  registers:
    kind: gpio
    version: ch585
    block: GPIO

- name: TMR0
  address: 0x40002000
  registers:
    kind: tmr
    version: ch585
    block: TMR_FULL

- name: TMR1
  address: 0x40002400
  registers:
    kind: tmr
    version: ch585
    block: TMR_FULL

- name: TMR2
  address: 0x40002800
  registers:
    kind: tmr
    version: ch585
    block: TMR_FULL

- name: TMR3
  address: 0x40002C00
  registers:
    kind: tmr
    version: ch585
    block: TMR_FULL

- name: UART0
  address: 0x40003000
  registers:
    kind: uart
    version: ch585
    block: UART_FULL

- name: UART1
  address: 0x40003400
  registers:
    kind: uart
    version: ch585
    block: UART_FULL

- name: UART2
  address: 0x40003800
  registers:
    kind: uart
    version: ch585
    block: UART_FULL

- name: UART3
  address: 0x40003C00
  registers:
    kind: uart
    version: ch585
    block: UART_FULL

- name: SPI0
  address: 0x40004000
  registers:
    kind: spi
    version: ch585
