# CH581. The CH585 die with SPI1, USBHS and LCD removed, from the CH581 SFR
# header, so this is data/family/CH585.yaml minus those three peripherals.
# CH584 keeps LCD; it has its own list in data/family/CH584.yaml.
#
# Register blocks are shared with CH585 except SYS, which loses the clock,
# pin and power fields that only gate the removed peripherals. See
# data/registers/sys_ch581.yaml.

# Pin muxing here is carried from CH585DS1 V1.6 tables 1-1 and 7-8, minus
# the removed peripherals; the CH581 SFR header gives the same pad and remap
# layout. Interrupt bindings likewise follow table 3-1 minus the vectors this
# part does not have.

- name: SYS
  address: 0x40001000
  registers:
    kind: sys
    version: ch581
    block: SYS
  interrupts:
    - signal: BAT
      interrupt: WDOG_BAT

- name: RTC
  address: 0x40001000
  registers:
    kind: rtc
    version: ch585
    block: RTC
  interrupts:
    - signal: GLOBAL
      interrupt: RTC

