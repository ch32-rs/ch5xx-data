    version: ch585
    block: USBFS


# Placeholder: the vendor SVD lists BLE at this address but gives it no
# registers, so there is nothing to generate yet. Kept so the base address
# stays recorded.
- name: BLE
  address: 0x4000C000

- name: LED
  address: 0x4000F000
  registers:
    kind: led
    version: ch585
    block: LED

- name: PFIC
  address: 0xE000E000
  registers:
    kind: pfic
    version: ch585
    block: PFIC

- name: Systick
  address: 0xE000F000
  registers:
    kind: systick
    version: ch585
    block: Systick
