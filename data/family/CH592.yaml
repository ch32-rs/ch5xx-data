# CH591 and CH592. Generated from svd/fixed/ch59xxx.svd by
# scripts/gen-from-svd.py. Clocks, pins and interrupts-per-signal are filled
# in by hand. Named after CH592; CH591 includes the same list.

- name: SYS
  address: 0x40001000
  registers:
    kind: sys
    version: ch592
    block: SYS

- name: RTC
  address: 0x40001000
  registers:
    kind: rtc
    version: ch585
    block: RTC

- name: System_control
  address: 0x40001000
  registers:
    kind: system_control
    version: ch592
    block: System_control

- name: TouchKey
  address: 0x40001000
  registers:
    kind: touchkey
    version: ch592
    block: TouchKey

- name: ADC
