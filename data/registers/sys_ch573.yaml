# Split from CH57X SYS blob for CH573. Kind sys.

block/SYS:
  description: SYS register.
  items:
  - name: RESET_STATUS
    description: RWA, reset status.
    byte_offset: 4
    access: Read
    bit_size: 8
    fieldset: RESET_STATUS
  - name: GLOB_ROM_CFG
    description: RWA, flash ROM configuration.
    byte_offset: 4
    bit_size: 8
    fieldset: GLOB_ROM_CFG
  - name: CLK_CFG
    description: RWA, system clock configuration, SAM.
    byte_offset: 8
    bit_size: 16
    fieldset: CLK_CFG
  - name: HFCK_PWR_CTRL
    description: RWA, high frequency clock module power control, SAM.
    byte_offset: 10
    bit_size: 8
