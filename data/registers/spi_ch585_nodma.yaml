# Reduced SPI: Master-only, no DMA registers. Used by SPI1 on CH585.
# Kind/block are SPI; distinguished from the full block by version ch585_nodma.

block/SPI:
  description: SPI register.
  items:
  - name: R8_SPI_CTRL_MOD
    description: RW, SPI mode control.
    byte_offset: 0
    bit_size: 8
    fieldset: R8_SPI_CTRL_MOD
  - name: R8_SPI_CTRL_CFG
    description: RW, SPI configuration control.
    byte_offset: 1
    bit_size: 8
    fieldset: R8_SPI_CTRL_CFG
  - name: R8_SPI_INTER_EN
    description: RW, SPI interrupt enable.
    byte_offset: 2
    bit_size: 8
    fieldset: R8_SPI_INTER_EN
  - name: R8_SPI_CLOCK_DIV
    description: RW, SPI master clock divisor;RW, SPI slave preset value.
    byte_offset: 3
    bit_size: 8
    fieldset: R8_SPI_CLOCK_DIV
  - name: R8_SPI_BUFFER
    description: RW, SPI data buffer.
    byte_offset: 4
    bit_size: 8
    fieldset: R8_SPI_BUFFER
  - name: R8_SPI_RUN_FLAG
    description: RO, SPI work flag.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: R8_SPI_RUN_FLAG
  - name: R8_SPI_INT_FLAG
    description: RW1, SPI interrupt flag.
    byte_offset: 6
    bit_size: 8
    fieldset: R8_SPI_INT_FLAG
  - name: R8_SPI_FIFO_COUNT
    description: RW, SPI FIFO count status.
    byte_offset: 7
    bit_size: 8
    fieldset: R8_SPI_FIFO_COUNT
  - name: R16_SPI_TOTAL_CNT
    description: RW, SPI total byte count, only low 12 bit.
    byte_offset: 12
    bit_size: 16
    fieldset: R16_SPI_TOTAL_CNT
  - name: R8_SPI_FIFO
    description: RO/WO, SPI FIFO register.
    byte_offset: 16
    bit_size: 8
    fieldset: R8_SPI_FIFO
  - name: R8_SPI_FIFO_COUNT1
    description: RO, SPI FIFO count status.
    byte_offset: 19
    access: Read
    bit_size: 8
    fieldset: R8_SPI_FIFO_COUNT1
fieldset/R16_SPI_TOTAL_CNT:
  description: RW, SPI total byte count, only low 12 bit.
  bit_size: 16
  fields:
  - name: R16_SPI_TOTAL_CNT
    description: RW, SPI total byte count, only low 12 bit.
    bit_offset: 0
    bit_size: 12
fieldset/R8_SPI_BUFFER:
  description: RW, SPI data buffer.
  bit_size: 8
  fields:
  - name: R8_SPI_BUFFER
    description: RW, SPI data buffer.
    bit_offset: 0
    bit_size: 8
fieldset/R8_SPI_CLOCK_DIV:
  description: RW, SPI master clock divisor;RW, SPI slave preset value.
  bit_size: 8
  fields:
  - name: R8_SPI_CLOCK_DIV
    description: RW, SPI master clock divisor;RW, SPI slave preset value.
    bit_offset: 0
    bit_size: 8
fieldset/R8_SPI_CTRL_CFG:
  description: RW, SPI configuration control.
  bit_size: 8
  fields:
  - name: RB_SPI_AUTO_IF
    description: RW, enable buffer/FIFO accessing to auto clear RB_SPI_IF_BYTE_END interrupt flag.
    bit_offset: 4
    bit_size: 1
  - name: RB_SPI_BIT_ORDER
    description: 'RW, SPI bit data order: 0=MSB first, 1=LSB first.'
    bit_offset: 5
    bit_size: 1
  - name: RB_SPI_MST_DLY_EN
    description: RW, SPI master input delay enable.
    bit_offset: 6
    bit_size: 1
fieldset/R8_SPI_CTRL_MOD:
  description: RW, SPI mode control.
  bit_size: 8
  fields:
  - name: RB_SPI_ALL_CLEAR
    description: RW, force clear SPI FIFO and count.
    bit_offset: 1
    bit_size: 1
  - name: RB_SPI_FIFO_DIR
    description: 'RW, SPI FIFO direction: 0=out(write @master mode), 1=in(read @master mode).'
    bit_offset: 4
    bit_size: 1
  - name: RB_SPI_SCK_OE
    description: RW, SPI SCK output enable.
    bit_offset: 5
    bit_size: 1
  - name: RB_SPI_MOSI_OE
    description: RW, SPI MOSI output enable.
    bit_offset: 6
    bit_size: 1
  - name: RB_SPI_MISO_OE
    description: RW, SPI MISO output enable.
    bit_offset: 7
    bit_size: 1
fieldset/R8_SPI_FIFO:
  description: RO/WO, SPI FIFO register.
  bit_size: 8
  fields:
  - name: R8_SPI_FIFO
    description: RO/WO, SPI FIFO register.
    bit_offset: 0
    bit_size: 8
fieldset/R8_SPI_FIFO_COUNT:
  description: RW, SPI FIFO count status.
  bit_size: 8
  fields:
  - name: R8_SPI_FIFO_COUNT
    description: RW, SPI FIFO count status.
    bit_offset: 0
    bit_size: 4
fieldset/R8_SPI_FIFO_COUNT1:
  description: RO, SPI FIFO count status.
  bit_size: 8
  fields:
  - name: R8_SPI_FIFO_COUNT1
    description: RO, SPI FIFO count status.
    bit_offset: 0
    bit_size: 8
fieldset/R8_SPI_INTER_EN:
  description: RW, SPI interrupt enable.
  bit_size: 8
  fields:
  - name: RB_SPI_IE_CNT_END
    description: RW, enable interrupt for SPI total byte count end.
    bit_offset: 0
    bit_size: 1
  - name: RB_SPI_IE_BYTE_END
    description: RW, enable interrupt for SPI byte exchanged.
    bit_offset: 1
    bit_size: 1
  - name: RB_SPI_IE_FIFO_HF
    description: RW, enable interrupt for SPI FIFO half.
    bit_offset: 2
    bit_size: 1
fieldset/R8_SPI_INT_FLAG:
  description: RW1, SPI interrupt flag.
  bit_size: 8
  fields:
  - name: RB_SPI_IF_CNT_END
    description: RW1, interrupt flag for SPI total byte count end.
    bit_offset: 0
    bit_size: 1
  - name: RB_SPI_IF_BYTE_END
    description: RW1, interrupt flag for SPI byte exchanged.
    bit_offset: 1
    bit_size: 1
  - name: RB_SPI_IF_FIFO_HF
    description: RW1, interrupt flag for SPI FIFO half.
    bit_offset: 2
    bit_size: 1
  - name: RB_SPI_IF_FIFO_OV
    description: RW1, interrupt flag for SPI FIFO overflow.
    bit_offset: 4
    bit_size: 1
  - name: RB_SPI_FREE
    description: RO, current SPI free status.
    bit_offset: 6
    bit_size: 1
fieldset/R8_SPI_RUN_FLAG:
  description: RO, SPI work flag.
  bit_size: 8
  fields:
  - name: RB_SPI_FIFO_READY
    description: RO, SPI FIFO ready status.
    bit_offset: 5
    bit_size: 1
