    description: SerDes PHY internal configuration bit.
    bit_offset: 0
    bit_size: 8
  - name: SERD_30M_SEL
    description: SerDes PHY reference clock source seletion.
    bit_offset: 8
    bit_size: 1
  - name: SERD_DN_SEL
    description: Enable SerDes PHY GXM test pin.
    bit_offset: 9
    bit_size: 1
fieldset/SERD_ANA_CFG2:
  description: Serdes Analog parameter configuration2.
  fields:
  - name: SERD_TRX_CFG
    description: Tx and RX parameter setting.
    bit_offset: 0
    bit_size: 25
