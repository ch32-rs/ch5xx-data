block/SYS:
  description: SYS register.
  items:
  - name: CLK_PLL_DIV
    description: output clock divider from PLL.
    byte_offset: 8
    bit_size: 8
    fieldset: CLK_PLL_DIV
  - name: CLK_CFG_CTRL
    description: clock control.
    byte_offset: 10
    bit_size: 8
    fieldset: CLK_CFG_CTRL
