    description: wake control.
    byte_offset: 14
    bit_size: 8
    fieldset: SLP_WAKE_CTRL
  - name: SLP_POWER_CTRL
    description: power control.
    byte_offset: 15
    bit_size: 8
    fieldset: SLP_POWER_CTRL
  - name: PIN_ALTERNATE
    description: alternate pin control.
    byte_offset: 18
    bit_size: 8
    fieldset: PIN_ALTERNATE
