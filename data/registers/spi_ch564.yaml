    bit_size: 8
    fieldset: FIFO_COUNT1

fieldset/TOTAL_CNT:
  description: SPI_FULL total byte count, only low 12 bit.
  bit_size: 16
  fields:
  - name: TOTAL_CNT
    description: SPI total byte count, only low 12 bit.
    bit_offset: 0
    bit_size: 12

fieldset/DMA_BEG:
  description: SPI_FULL DMA begin address.
  fields:
  - name: DMA_BEG
    description: SPI DMA begin address.
    bit_offset: 0
    bit_size: 18

fieldset/DMA_END:
  description: SPI_FULL DMA end address.
  fields:
  - name: DMA_END
    description: SPI DMA end address.
    bit_offset: 0
    bit_size: 18

fieldset/DMA_NOW:
  description: SPI_FULL DMA current address.
  fields:
  - name: DMA_NOW
    description: SPI DMA current address.
    bit_offset: 0
    bit_size: 18

fieldset/BUFFER:
  description: SPI_FULL data buffer.
  bit_size: 8
  fields:
  - name: BUFFER
    description: SPI data buffer.
    bit_offset: 0
    bit_size: 8

fieldset/BUSY:
  description: SPI_FULL busy flag register.
  bit_size: 8
  fields:
  - name: BUSY
    description: busy flag bit.
    bit_offset: 0
    bit_size: 1

fieldset/CLOCK_DIV:
  description: SPI_FULL master clock divisor.
  bit_size: 8
  fields:
  - name: CLOCK_DIV
    description: master clock divisor.
    bit_offset: 0
    bit_size: 8
fieldset/SLAVE_PRE:
  description: SPI_FULL slave preset value.
  bit_size: 8
  fields:
  - name: SLAVE_PRE
    description: slave preset value.
    bit_offset: 0
    bit_size: 8

fieldset/CTRL_DMA_FULL:
  description: SPI_FULL DMA control.
  bit_size: 8
  fields:
  - name: DMA_ENABLE
    description: SPI DMA enable.
    bit_offset: 0
    bit_size: 1
  - name: DMA_BURST
    description: DMA block operates on the enable bit.
    bit_offset: 1
    bit_size: 1
  - name: DMA_LOOP
    description: SPI DMA address loop enable.
    bit_offset: 2
    bit_size: 1
  - name: HS_HOST
    description: High speed host receive mode control bit.
    bit_offset: 7
    bit_size: 1

fieldset/CTRL_MOD_FULL:
  description: SPI_FULL mode control.
  bit_size: 8
  fields:
  - name: MODE_SLAVE
    description: SPI slave mode.
    bit_offset: 0
    bit_size: 1
  - name: ALL_CLEAR
    description: force clear SPI FIFO and count.
    bit_offset: 1
    bit_size: 1
  - name: 2WIRE_MOD
    description: SPI enable 2 wire mode.
    bit_offset: 2
    bit_size: 1
  - name: MST_SCK_MOD
    description: SPI master clock mode.
    bit_offset: 3
    bit_size: 1
  - name: SLV_CMD_MOD
    description: SPI slave command mode.
    bit_offset: 3
    bit_size: 1
  - name: FIFO_DIR
    description: SPI FIFO direction.
    bit_offset: 4
    bit_size: 1
  - name: SCK_OE
    description: SPI SCK output enable.
    bit_offset: 5
    bit_size: 1
  - name: MOSI_OE
    description: SPI MOSI output enable.
    bit_offset: 6
    bit_size: 1
  - name: MISO_OE
    description: SPI MISO output enable.
    bit_offset: 7
    bit_size: 1

fieldset/FIFO:
  description: SPI_FULL FIFO register.
  bit_size: 8
  fields:
  - name: FIFO
    description: SPI FIFO register.
    bit_offset: 0
    bit_size: 8

fieldset/FIFO_COUNT:
  description: SPI_FULL FIFO count status.
  bit_size: 8
  fields:
  - name: FIFO_COUNT
    description: SPI FIFO count status.
    bit_offset: 0
    bit_size: 8

fieldset/FIFO_COUNT1:
  description: SPI_FULL FIFO count status.
  bit_size: 8
  fields:
  - name: FIFO_COUNT1
    description: SPI FIFO count statu.
    bit_offset: 0
    bit_size: 8

fieldset/INTER_EN_FULL:
  description: SPI_FULL interrupt enable.
  bit_size: 8
  fields:
  - name: IE_CNT_END
    description: enable interrupt for SPI total byte count end.
    bit_offset: 0
    bit_size: 1
  - name: IE_BYTE_END
    description: enable interrupt for SPI single byte exchanged.
    bit_offset: 1
    bit_size: 1
  - name: IE_FIFO_HF
    description: enable interrupt for SPI FIFO half.
    bit_offset: 2
    bit_size: 1
  - name: IE_DMA_END
    description: enable interrupt for SPI DMA completion.
    bit_offset: 3
    bit_size: 1
  - name: IE_FIFO_OV
    description: enable interrupt for SPI FIFO overflow.
    bit_offset: 4
    bit_size: 1
  - name: IE_DMA_ERR
    description: enable interrupt for DMA transfer error.
    bit_offset: 5
    bit_size: 1
  - name: IE_FST_BYTE
    description: enable interrupt for SPI slave mode first byte received.
    bit_offset: 7
    bit_size: 1

fieldset/INT_FLAG_FULL:
  description: SPI_FULL interrupt flag.
  bit_size: 8
  fields:
  - name: IF_CNT_END
    description: interrupt flag for SPI total byte count end.
    bit_offset: 0
    bit_size: 1
  - name: IF_BYTE_END
    description: interrupt flag for SPI byte exchanged.
    bit_offset: 1
    bit_size: 1
  - name: IF_FIFO_HF
    description: interrupt flag for SPI FIFO half.
    bit_offset: 2
    bit_size: 1
  - name: IF_DMA_END
    description: interrupt flag for SPI DMA completion.
    bit_offset: 3
    bit_size: 1
  - name: IF_FIFO_OV
    description: interrupt flag for SPI FIFO overflow.
    bit_offset: 4
    bit_size: 1
  - name: IF_DMA_ERR
    description: interrupt flag for SPI DMA transfer error.
    bit_offset: 5
    bit_size: 1
  - name: FREE
    description: current SPI free status.
    bit_offset: 6
    bit_size: 1
  - name: IF_FST_BYTE
    description: interrupt flag for SPI slave mode first byte received.
    bit_offset: 7
    bit_size: 1

fieldset/RESET_CMD:
  description: SPI_FULL reset command word register.
  bit_size: 8
  fields:
  - name: RESET_CMD
    description: A global reset is generated when this command is received.
    bit_offset: 0
    bit_size: 8

fieldset/RUN_FLAG_FULL:
  description: SPI_FULL work flag.
  bit_size: 8
  fields:
  - name: SLV_CMD_ACT
    description: SPI slave command flag.
    bit_offset: 4
    bit_size: 1
  - name: FIFO_READY
    description: SPI FIFO ready status.
    bit_offset: 5
    bit_size: 1
  - name: SLV_CS_LOAD
    description: SPI slave chip-select loading status.
    bit_offset: 6
    bit_size: 1
  - name: SLV_SELECT
    description: SPI slave selection status.
    bit_offset: 7
    bit_size: 1

