# SPI on CH564. SPI0 is SPI_FULL; SPI1 is SPI_NODMA (no DMA addr regs).

block/SPI_FULL:
  description: SPI_FULL register.
  items:
  - name: CTRL_MOD
    description: SPI_FULL mode control.
    byte_offset: 0
    bit_size: 8
    fieldset: CTRL_MOD_FULL
  - name: CTRL_DMA
    description: SPI_FULL DMA control.
    byte_offset: 1
    bit_size: 8
    fieldset: CTRL_DMA_FULL
  - name: INTER_EN
    description: SPI_FULL interrupt enable.
    byte_offset: 2
    bit_size: 8
    fieldset: INTER_EN_FULL
  - name: CLOCK_DIV
    description: SPI_FULL master clock divisor.
    byte_offset: 3
    bit_size: 8
    fieldset: CLOCK_DIV
  - name: SLAVE_PRE
    description: SPI_FULL slave preset value.
    byte_offset: 3
    bit_size: 8
    fieldset: SLAVE_PRE
  - name: BUFFER
    description: SPI_FULL data buffer.
    byte_offset: 4
    bit_size: 8
    fieldset: BUFFER
  - name: RUN_FLAG
    description: SPI_FULL work flag.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: RUN_FLAG_FULL
  - name: INT_FLAG
    description: SPI_FULL interrupt flag.
    byte_offset: 6
    bit_size: 8
    fieldset: INT_FLAG_FULL
  - name: FIFO_COUNT
    description: SPI_FULL FIFO count status.
    byte_offset: 7
    access: Read
    bit_size: 8
    fieldset: FIFO_COUNT
  - name: RESET_CMD
    description: SPI_FULL reset command word register.
    byte_offset: 8
    bit_size: 8
    fieldset: RESET_CMD
  - name: BUSY
    description: SPI_FULL busy flag register.
    byte_offset: 9
    bit_size: 8
    fieldset: BUSY
  - name: TOTAL_CNT
    description: SPI_FULL total byte count, only low 12 bit.
    byte_offset: 12
    bit_size: 16
    fieldset: TOTAL_CNT
  - name: FIFO
    description: SPI_FULL FIFO register.
    byte_offset: 16
    bit_size: 8
    fieldset: FIFO
  - name: FIFO_COUNT1
    description: SPI_FULL FIFO count status.
    byte_offset: 19
    access: Read
    bit_size: 8
    fieldset: FIFO_COUNT1
  - name: DMA_NOW
    description: SPI_FULL DMA current address.
    byte_offset: 20
    fieldset: DMA_NOW
  - name: DMA_BEG
    description: SPI_FULL DMA begin address.
    byte_offset: 24
    fieldset: DMA_BEG
  - name: DMA_END
    description: SPI_FULL DMA end address.
    byte_offset: 28
    fieldset: DMA_END

block/SPI_NODMA:
  description: SPI_NODMA register.
  items:
  - name: CTRL_MOD
    description: SPI_NODMA mode control.
    byte_offset: 0
    bit_size: 8
