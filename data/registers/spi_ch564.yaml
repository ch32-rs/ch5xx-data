    bit_size: 8
    fieldset: INTER_EN_NODMA
  - name: CLOCK_DIV
    description: SPI_NODMA master clock divisor.
    byte_offset: 3
    bit_size: 8
    fieldset: CLOCK_DIV
  - name: BUFFER
    description: SPI_NODMA data buffer.
    byte_offset: 4
    bit_size: 8
    fieldset: BUFFER
  - name: RUN_FLAG
    description: SPI_NODMA work flag.
    byte_offset: 5
    access: Read
    bit_size: 8
