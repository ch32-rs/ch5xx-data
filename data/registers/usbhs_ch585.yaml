fieldset/UH_CONTROL:
  description: RW, USBHS Host Control Register.
  fields:
  - name: PID_MASK30
    description: Transaction token package PID.
    bit_offset: 0
    bit_size: 4
  - name: ENDP_MASK30
    description: Transaction token package endpoint number.
    bit_offset: 4
    bit_size: 4
  - name: TOG_MASK10
    description: Sent data PID.
    bit_offset: 8
    bit_size: 2
  - name: BUF_MODE
    description: Data cache control bit.
    bit_offset: 10
    bit_size: 1
  - name: HOST_ACTION
    description: HOST enables transaction execution, and this bit is automatically reset to zero after the transaction is completed.
    bit_offset: 16
    bit_size: 1
  - name: LPM_VALID
    description: Sending LPM package is valid.
    bit_offset: 17
    bit_size: 1
  - name: SPLIT_VALID
    description: Sending SPLIT package is valid.
    bit_offset: 18
    bit_size: 1
  - name: DOWN_LOWSPD
    description: When the port is operating at full speed and needs to send low-speed packets (PRE), this bit must be enabled.
    bit_offset: 19
    bit_size: 1
  - name: TX_NO_DATA
    description: There is no data packet after the OUT/SETUP token packet, used for high-speed SPLIT packets.
    bit_offset: 20
    bit_size: 1
  - name: RX_NO_DATA
    description: Expected data packet after IN token packet, used for high-speed SPLIT packet.
    bit_offset: 21
    bit_size: 1
  - name: TX_NO_RES
    description: OUT/SETUP - DATA does not expect a response, used for synchronous transmission or high-speed SPLIT packets.
    bit_offset: 22
    bit_size: 1
  - name: RX_NO_RES
    description: IN-DATA no response, used for synchronous transmission or high-speed SPLIT packets.
    bit_offset: 23
    bit_size: 1
