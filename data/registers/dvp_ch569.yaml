  description: DVP col count value.
  bit_size: 16
  fields:
  - name: DVP_COL_CNT
    description: DVP receive fifo ready.
    bit_offset: 0
    bit_size: 16
fieldset/COL_NUM:
  description: DVP row number of a frame indicator register.
  bit_size: 16
  fields:
  - name: DVP_COL_NUM
    description: the number of PCLK cyccles contained in a row of data in RGB mode.
    bit_offset: 0
    bit_size: 16
fieldset/ROW_CNT:
  description: DVP row count value.
  bit_size: 16
  fields:
  - name: DVP_ROW_CNT
    description: DVP receive fifo full.
    bit_offset: 0
    bit_size: 16
fieldset/ROW_NUM:
  description: DVP row number of a frame indicator register.
  bit_size: 16
  fields:
  - name: DVP_ROW_NUM
    description: the number of rows contained in a frame of image data.
    bit_offset: 0
    bit_size: 16
fieldset/DMA_BUF0:
  description: DVP dma buffer0 addr.
  fields:
  - name: DVP_DMA_BUF0
    description: the receiving address 0 of DMA.
    bit_offset: 0
    bit_size: 17
fieldset/DMA_BUF1:
  description: DVP dma buffer1 addr.
  fields:
  - name: DVP_DMA_BUF1
    description: the receiving address1 of DMA.
    bit_offset: 0
    bit_size: 17
