    bit_size: 1
  - name: DVP_IF_ROW_DONE
    description: interrupt flag for DVP row receive done.
    bit_offset: 1
    bit_size: 1
  - name: DVP_IF_FRM_DONE
    description: interrupt flag for DVP frame receive done.
    bit_offset: 2
    bit_size: 1
  - name: DVP_IF_FIFO_OV
    description: interrupt flag for DVP receive fifo overflow.
    bit_offset: 3
    bit_size: 1
  - name: DVP_IF_STP_FRM
    description: interrupt flag for DVP frame stop.
    bit_offset: 4
    bit_size: 1
