# Split from CH57X SYS blob for CH573. Kind touchkey.

block/TouchKey:
  description: TouchKey register.
  items:
  - name: TKEY_COUNT
    description: RW, Touchkey charge and discharge count.
    byte_offset: 84
    bit_size: 8
    fieldset: TKEY_COUNT
  - name: TKEY_CONVERT
    description: RW, Touchkey convert start control.
    byte_offset: 86
    bit_size: 8
    fieldset: TKEY_CONVERT
  - name: TKEY_CFG
    description: RW, Touchkey configure.
    byte_offset: 87
    bit_size: 8
    fieldset: TKEY_CFG

fieldset/TKEY_CFG:
  description: RW, Touchkey configure.
  bit_size: 8
  fields:
  - name: TKEY_PWR_ON
    description: RW, Touchkey power on.
    bit_offset: 0
    bit_size: 1
  - name: TKEY_CURRENT
    description: RW, Touchkey charge current selection.
    bit_offset: 1
    bit_size: 1
  - name: TKEY_PGA_ADJ
    description: RW, ADC input PGA speed selection.
    bit_offset: 3
    bit_size: 1

fieldset/TKEY_CONVERT:
  description: RW, Touchkey convert start control.
  bit_size: 8
  fields:
  - name: TKEY_START
    description: RW, Touchkey convert start control.
    bit_offset: 0
    bit_size: 1

fieldset/TKEY_COUNT:
  description: RW, Touchkey charge and discharge count.
  bit_size: 8
  fields:
  - name: TKEY_CHARG_CNT
    description: RW, Touchkey charge count.
    bit_offset: 0
    bit_size: 5
  - name: TKEY_DISCH_CNT
    description: RW, Touchkey discharge count.
    bit_offset: 5
    bit_size: 3

