# Serial flash command engine at 0x40001800, omitted from the vendor SVD.
#
# Not a plain register file: erase and program are a command byte plus address
# bytes on DATA_BYTE, program words on DATA, with CTRL bit 7 polled for the
# handshake. SCK and CFG hold the engine timing and must follow the clock tree.
# CH595 replaced this engine with a page-latch controller (flashrom_ch595);
# CH564 and CH569 put their controller inside SYS instead.

block/FLASHROM:
  description: Serial flash command engine.
  items:
  - name: DATA
    description: RW, 32-bit program data.
    byte_offset: 0
    bit_size: 32
  - name: DATA_BYTE
    description: RW, command, address and byte-program data port.
    byte_offset: 4
    bit_size: 8
  - name: SCK
    description: RW, engine clock timing.
    byte_offset: 5
    bit_size: 8
  - name: CTRL
    description: RW, handshake control; bit 7 is busy.
    byte_offset: 6
    bit_size: 8
  - name: CFG
    description: RW, engine access configuration.
    byte_offset: 7
    bit_size: 8
