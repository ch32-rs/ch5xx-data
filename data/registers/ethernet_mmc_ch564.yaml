    bit_offset: 21
    bit_size: 1
fieldset/MMCTIR:
  description: Ethernet MMC transmit interrupt register. (ETH_MMCTIR).
  fields:
  - name: TGFS
    description: Transmitted good frames. status.
    bit_offset: 21
    bit_size: 1
fieldset/STATE:
  description: Ethernet state machine register.
  fields:
  - name: ETX_STATE
