    description: 'ReadOnly: indicate current UDP pin level.'
    bit_offset: 5
    bit_size: 1
  - name: RB_UD_PD_DIS__UH_PD_DIS
    description: 'disable USB UDP-UDM pulldown resistance: 0=enable pulldown, 1=disable.'
    bit_offset: 7
    bit_size: 1
