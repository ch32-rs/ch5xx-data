block/ADC:
  description: ADC register.
  items:
  - name: R8_ADC_CTRL_MOD
    description: ADC mode control register.
    byte_offset: 0
    bit_size: 8
    fieldset: R8_ADC_CTRL_MOD
  - name: R8_ADC_CTRL_DMA
    description: DMA control register.
    byte_offset: 1
    bit_size: 8
    fieldset: R8_ADC_CTRL_DMA
  - name: R8_ADC_INTER_EN
    description: ADC interrupt the enabling register.
    byte_offset: 2
    bit_size: 8
    fieldset: R8_ADC_INTER_EN
  - name: R8_ADC_CLOCK_DIV
    description: ADC clock frequency partition coefficient register.
    byte_offset: 3
    bit_size: 8
    fieldset: R8_ADC_CLOCK_DIV
