# GPIO on CH572/CH570. PA_INT_EDGE_TYPE (0x96) is per the DS table 7-8;
# the vendor SVD jumps 0x94 -> 0x9C.
block/GPIO:
  description: General porpose intput output.
  items:
  - name: PA_INT_EN
    description: RW, GPIO PA interrupt enable.
    byte_offset: 144
    bit_size: 16
    fieldset: PA_INT_EN
  - name: PA_INT_MODE
    description: 'RW, GPIO PA interrupt mode: 0=level action, 1=edge action.'
    byte_offset: 148
    bit_size: 16
    fieldset: PA_INT_MODE
  - name: PA_INT_EDGE_TYPE
    description: 'RW, GPIO PA interrupt edge type: 0=polarity sensitive, 1=non-polarity sensitive.'
    byte_offset: 150
    bit_size: 16
    fieldset: PA_INT_EDGE_TYPE
  - name: PA_INT_IF
    description: RW1, GPIO PA interrupt flag.
    byte_offset: 156
    bit_size: 16
    fieldset: PA_INT_IF
  - name: PA_DIR
    description: 'RW, GPIO PA I/O direction: 0=in, 1=out.'
    byte_offset: 160
    fieldset: PA_DIR
  - name: PA_PIN
    description: RO, GPIO PA input.
    byte_offset: 164
    access: Read
    fieldset: PA_PIN
  - name: PA_OUT
    description: RW, GPIO PA output.
    byte_offset: 168
    fieldset: PA_OUT
  - name: PA_CLR
    description: 'WZ, GPIO PA clear output: 0=keep, 1=clear.'
    byte_offset: 172
    access: Write
    fieldset: PA_CLR
  - name: PA_PU
    description: RW, GPIO PA pullup resistance enable.
    byte_offset: 176
    fieldset: PA_PU
  - name: PA_PD_DRV
    description: RW, PA pulldown for input or PA driving capability for output.
    byte_offset: 180
    fieldset: PA_PD_DRV
  - name: PA_SET
    description: WZ, PA port output set register.
    byte_offset: 184
    access: Write
    fieldset: PA_SET
fieldset/PA_INT_EN:
  description: RW, GPIO PA interrupt enable.
  bit_size: 16
  fields:
  - name: PA_INT_EN
    description: GPIO PA interrupt enable.
    bit_offset: 0
    bit_size: 16
fieldset/PA_INT_EDGE_TYPE:
  description: 'RW, GPIO PA interrupt edge type: 0=polarity sensitive, 1=non-polarity sensitive.'
  bit_size: 16
  fields:
  - name: PA_INT_EDGE_TYPE
    description: 'GPIO PA interrupt edge type: 0=polarity sensitive, 1=non-polarity sensitive.'
    bit_offset: 0
    bit_size: 16
fieldset/PA_INT_IF:
  description: RW1, GPIO PA interrupt flag.
  bit_size: 16
  fields:
  - name: PA_INT_IF
    description: GPIO PA interrupt flag.
    bit_offset: 0
    bit_size: 16
fieldset/PA_INT_MODE:
  description: 'RW, GPIO PA interrupt mode: 0=level action, 1=edge action.'
  bit_size: 16
  fields:
  - name: PA_INT_MODE
    description: GPIO PA interrupt mode.
    bit_offset: 0
    bit_size: 16
fieldset/PA_CLR:
  description: 'WZ, GPIO PA clear output: 0=keep, 1=clear.'
  fields:
  - name: PA_CLR
    description: 'GPIO PA clear output: write 1 to drive the pin output low, write 0 leaves it unchanged.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_DIR:
  description: 'RW, GPIO PA I/O direction: 0=in, 1=out.'
  fields:
  - name: PA_DIR
    description: 'GPIO PA I/O direction: 0=input, 1=output.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_OUT:
  description: RW, GPIO PA output.
  fields:
  - name: PA_OUT
    description: 'GPIO PA output level: 1=high, 0=low; when the pin is an input, selects the interrupt polarity (1=high level or rising edge, 0=low level or falling edge).'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_PD_DRV:
  description: RW, PA pulldown for input or PA driving capability for output.
  fields:
  - name: PA_PD_DRV
    description: 'GPIO PA pull-down enable: 1=enabled, 0=disabled; when the pin is an output, selects the drive strength (1=20mA, 0=5mA).'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_PIN:
  description: RO, GPIO PA input.
  fields:
  - name: PA_PIN
    description: 'GPIO PA input level: 1=high, 0=low.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_PU:
  description: RW, GPIO PA pullup resistance enable.
  fields:
  - name: PA_PU
    description: 'GPIO PA pull-up resistor: 1=enabled, 0=disabled.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_SET:
  description: WZ, PA port output set register.
  fields:
  - name: PA_SET
    description: 'GPIO PA set output: write 1 to drive the pin output high, write 0 leaves it unchanged.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
