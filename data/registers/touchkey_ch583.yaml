# Split from CH58X SYS blob for CH583. Kind touchkey.

block/TouchKey:
  description: TouchKey register.
  items:
  - name: COUNT
    description: RW, Touchkey charge and discharge count.
    byte_offset: 84
    bit_size: 8
    fieldset: COUNT
  - name: CONVERT
    description: RW, Touchkey convert start control.
    byte_offset: 86
    bit_size: 8
    fieldset: CONVERT
  - name: CFG
    description: RW, Touchkey configure.
    byte_offset: 87
    bit_size: 8
    fieldset: CFG

fieldset/CFG:
  description: RW, Touchkey configure.
  bit_size: 8
  fields:
  - name: PWR_ON
    description: RW, Touchkey power on.
    bit_offset: 0
    bit_size: 1
  - name: CURRENT
    description: RW, Touchkey charge current selection.
    bit_offset: 1
    bit_size: 1
  - name: DRV_EN
    description: RW, Touchkey drive shield enable.
    bit_offset: 2
    bit_size: 1
  - name: PGA_ADJ
    description: RW, ADC input PGA speed selection.
    bit_offset: 3
    bit_size: 1

fieldset/CONVERT:
  description: RW, Touchkey convert start control.
  bit_size: 8
  fields:
  - name: START
    description: RW, Touchkey convert start control.
    bit_offset: 0
    bit_size: 1

fieldset/COUNT:
  description: RW, Touchkey charge and discharge count.
  bit_size: 8
  fields:
  - name: CHARG_CNT
    description: RW, Touchkey charge count.
    bit_offset: 0
    bit_size: 5
  - name: DISCH_CNT
    description: RW, Touchkey discharge count.
    bit_offset: 5
    bit_size: 3

