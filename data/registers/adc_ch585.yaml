  description: RW, temperature sensor control.
  bit_size: 8
  fields:
  - name: RB_TEM_SEN_PWR_ON
    description: 'RW, temperature sensor power control: 0=power down, 1=power on.'
    bit_offset: 7
    bit_size: 1
