block/ADC:
  description: Analog to Digital Converter.
  items:
  - name: CHANNEL
    description: RW, ADC input channel selection.
    byte_offset: 88
    bit_size: 8
    fieldset: CHANNEL
  - name: CFG
    description: RW, ADC configure.
    byte_offset: 89
    bit_size: 8
    fieldset: CFG
  - name: CONVERT
    description: RW, ADC convert control.
    byte_offset: 90
    bit_size: 8
    fieldset: CONVERT
  - name: TEM_SENSOR
    description: RW, temperature sensor control.
    byte_offset: 91
    bit_size: 8
    fieldset: TEM_SENSOR
  - name: DATA
    description: RO, ADC data.
    byte_offset: 92
    access: Read
    bit_size: 16
    fieldset: DATA
  - name: INT_FLAG
    description: RO, ADC interrupt flag register.
    byte_offset: 94
    access: Read
    bit_size: 8
    fieldset: INT_FLAG
  - name: CTRL_DMA
    description: RW, ADC DMA control.
    byte_offset: 97
    bit_size: 8
    fieldset: CTRL_DMA
  - name: DMA_IF
    description: RW1, ADC and DMA interrupt flag registers.
    byte_offset: 98
    bit_size: 8
    fieldset: DMA_IF
  - name: AUTO_CYCLE
    description: RO, ADC interrupt flag.
    byte_offset: 99
    bit_size: 8
    fieldset: AUTO_CYCLE
  - name: DMA_NOW
    description: RO, ADC DMA current address.
    byte_offset: 100
    access: Read
    fieldset: DMA_NOW
  - name: DMA_BEG
    description: RW, ADC DMA begin address.
    byte_offset: 104
    fieldset: DMA_BEG
  - name: DMA_END
    description: RW, ADC DMA end address.
    byte_offset: 108
    fieldset: DMA_END
fieldset/DATA:
  description: RO, ADC data.
  bit_size: 16
  fields:
  - name: DATA
    description: RO, ADC conversion data.
    bit_offset: 0
    bit_size: 12
fieldset/DMA_BEG:
  description: RW, ADC DMA begin address.
  fields:
  - name: DMA_BEG
    description: ADC DMA begin address.
    bit_offset: 1
    bit_size: 16
fieldset/DMA_END:
  description: RW, ADC DMA end address.
  fields:
  - name: DMA_END
    description: ADC DMA end address.
    bit_offset: 1
    bit_size: 16
fieldset/DMA_NOW:
  description: RO, ADC DMA current address.
  fields:
  - name: DMA_NOW
    description: ADC DMA current address.
    bit_offset: 1
    bit_size: 16
fieldset/AUTO_CYCLE:
  description: RO, ADC interrupt flag.
  bit_size: 8
  fields:
  - name: AUTO_CYCLE
    description: auto ADC cycle value, unit is 16 Fsys.
    bit_offset: 0
    bit_size: 8
fieldset/CFG:
  description: RW, ADC configure.
  bit_size: 8
  fields:
  - name: POWER_ON
    description: 'RW, ADC power control: 0=power down, 1=power on.'
    bit_offset: 0
    bit_size: 1
  - name: BUF_EN
    description: RW, ADC input buffer enable.
    bit_offset: 1
    bit_size: 1
  - name: DIFF_EN
    description: 'RW, ADC input channel mode: 0=single-end, 1=differnetial.'
    bit_offset: 2
    bit_size: 1
  - name: OFS_TEST
    description: 'RW, enable ADC offset test mode: 0=normal mode, 1=short to test offset.'
    bit_offset: 3
    bit_size: 1
  - name: PGA_GAIN10
    description: 'RW, set ADC input PGA gain: 00=-12dB, 01=-6dB, 10=0dB, 11=6dB.'
    bit_offset: 4
    bit_size: 2
  - name: CLK_DIV
    description: 'RW, select ADC clock frequency: 00=3.2MHz, 01=2.67MHz, 10=5.33MHz, 11=4MHz.'
    bit_offset: 6
    bit_size: 2
fieldset/CHANNEL:
  description: RW, ADC input channel selection.
  bit_size: 8
  fields:
  - name: CH_INX
    description: RW, ADC input channel index.
    bit_offset: 0
    bit_size: 5
fieldset/CONVERT:
  description: RW, ADC convert control.
  bit_size: 8
  fields:
  - name: START
    description: 'RW, ADC convert start control: 0=stop ADC convert, 1=start an ADC convert, auto clear.'
    bit_offset: 0
    bit_size: 1
  - name: PGA_GAIN2
    description: RW, ADC input PGA gain direction selection, combined with RB_ ADC_ PGA_ GAIN [1:0] usage.
    bit_offset: 1
    bit_size: 1
  - name: SAMPLE_TIME
    description: RW, ADC sampling period selection.
    bit_offset: 4
    bit_size: 2
  - name: EOC_X
    description: RO, end of ADC conversion flag.
    bit_offset: 7
    bit_size: 1
fieldset/CTRL_DMA:
  description: RW, ADC DMA control.
  bit_size: 8
  fields:
  - name: DMA_ENABLE
    description: RW, ADC DMA enable.
    bit_offset: 0
    bit_size: 1
  - name: DMA_LOOP
    description: RW, ADC DMA address loop enable.
    bit_offset: 2
    bit_size: 1
  - name: IE_DMA_END
    description: RW, enable interrupt for ADC DMA completion.
    bit_offset: 3
    bit_size: 1
  - name: IE_EOC
    description: RW, enable interrupt for end of ADC conversion.
    bit_offset: 4
    bit_size: 1
  - name: SCAN_AUTO_TYPE
    description: 'RW, ADC SCAN mode: 1: continuous triggering 0: periodic triggering.'
    bit_offset: 5
    bit_size: 1
  - name: CONT_EN
    description: RW, enable contineous conversion ADC.
    bit_offset: 6
    bit_size: 1
  - name: AUTO_EN
    description: RW, enable auto continuing ADC for DMA.
    bit_offset: 7
    bit_size: 1
fieldset/DMA_IF:
  description: RW1, ADC and DMA interrupt flag registers.
  bit_size: 8
  fields:
  - name: IF_DMA_END
    description: interrupt flag for ADC DMA completion.
    bit_offset: 3
    bit_size: 1
  - name: IF_END
    description: interrupt flag for end of ADC conversion.
    bit_offset: 4
    bit_size: 1
fieldset/INT_FLAG:
  description: RO, ADC interrupt flag register.
  bit_size: 8
  fields:
  - name: IF_EOC
    description: RO, ADC conversion interrupt flag.
    bit_offset: 7
    bit_size: 1
fieldset/TEM_SENSOR:
  description: RW, temperature sensor control.
  bit_size: 8
  fields:
  - name: TEM_SEN_PWR_ON
    description: 'RW, temperature sensor power control: 0=power down, 1=power on.'
    bit_offset: 7
    bit_size: 1
