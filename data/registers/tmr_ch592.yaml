# Timer on CH592. block/TMR_FULL has DMA (TMR1/TMR2);
# block/TMR_NODMA has no DMA address registers (TMR0/TMR3). Kind is tmr.

block/TMR_FULL:
  description: Timer1 register.
  items:
  - name: CTRL_MOD
    description: RW, TMR mode control.
    byte_offset: 0
    bit_size: 8
    fieldset: CTRL_MOD
  - name: CTRL_DMA
    description: RW, TMR DMA control.
    byte_offset: 1
    bit_size: 8
    fieldset: CTRL_DMA
  - name: INTER_EN
    description: RW, TMR interrupt enable.
    byte_offset: 2
    bit_size: 8
    fieldset: INTER_EN
  - name: INT_FLAG
    description: RW1, TMR interrupt flag.
    byte_offset: 6
    bit_size: 8
    fieldset: INT_FLAG
  - name: FIFO_COUNT
    description: RO, TMR FIFO count status.
    byte_offset: 7
    access: Read
    bit_size: 8
    fieldset: FIFO_COUNT
  - name: COUNT
    description: RO, TMR current count.
    byte_offset: 8
    access: Read
    fieldset: COUNT
  - name: CNT_END
    description: RW, TMR end count value, only low 26 bit.
    byte_offset: 12
    fieldset: CNT_END
  - name: FIFO
    description: RO, TMR FIFO register, only low 26 bit.
    byte_offset: 16
    access: Read
    fieldset: FIFO
  - name: DMA_NOW
    description: RO, TMR DMA current address.
    byte_offset: 20
    access: Read
    bit_size: 16
    fieldset: DMA_NOW
  - name: DMA_BEG
    description: RW, TMR DMA begin address.
    byte_offset: 24
    bit_size: 16
    fieldset: DMA_BEG
  - name: DMA_END
    description: RW, TMR DMA end address.
    byte_offset: 28
    bit_size: 16
    fieldset: DMA_END

block/TMR_NODMA:
  description: Timer0 register.
  items:
  - name: CTRL_MOD
    description: RW, TMR mode control.
    byte_offset: 0
    bit_size: 8
    fieldset: CTRL_MOD
  - name: INTER_EN
    description: RW, TMR interrupt enable.
    byte_offset: 2
    bit_size: 8
    fieldset: INTER_EN
  - name: INT_FLAG
    description: RW1, TMR interrupt flag.
    byte_offset: 6
    access: Read
    bit_size: 8
    fieldset: INT_FLAG
  - name: FIFO_COUNT
    description: RO, TMR FIFO count status.
    byte_offset: 7
    access: Read
    bit_size: 8
    fieldset: FIFO_COUNT
  - name: COUNT
    description: RO, TMR current count.
    byte_offset: 8
    access: Read
    fieldset: COUNT
  - name: CNT_END
    description: RW, TMR end count value, only low 26 bit.
    byte_offset: 12
    fieldset: CNT_END
  - name: FIFO
    description: RO/WO, TMR FIFO register, only low 26 bit.
    byte_offset: 16
    access: Read
    fieldset: FIFO

fieldset/DMA_BEG:
  description: RW, TMR DMA begin address.
  bit_size: 16
  fields:
  - name: DMA_BEG
    description: RW,TMR DMA data buffer start address.
    bit_offset: 2
    bit_size: 13

fieldset/DMA_END:
  description: RW, TMR DMA end address.
  bit_size: 16
  fields:
  - name: DMA_END
    description: RW,DMA data buffer end address.
    bit_offset: 2
    bit_size: 13

fieldset/DMA_NOW:
  description: RO, TMR DMA current address.
  bit_size: 16
  fields:
  - name: DMA_NOW
    description: RO,DMA data buffer current address.
    bit_offset: 2
    bit_size: 13

fieldset/CNT_END:
  description: RW, TMR end count value, only low 26 bit.
  fields:
  - name: CNT_END
    description: RW1,TMR end count value,.
    bit_offset: 0
    bit_size: 32

fieldset/COUNT:
  description: RO, TMR current count.
  fields:
  - name: COUNT
    description: RW1,TMR current count.
    bit_offset: 0
    bit_size: 26

fieldset/FIFO:
  description: RO, TMR FIFO register, only low 26 bit.
  fields:
  - name: FIFO
    description: RW1,TMR FIFO register.
    bit_offset: 0
    bit_size: 32

fieldset/CTRL_DMA:
  description: RW, TMR DMA control.
  bit_size: 8
  fields:
  - name: TMR_DMA_ENABLE
    description: RW, timer1/2 DMA enable.
    bit_offset: 0
    bit_size: 1
  - name: TMR_DMA_LOOP
    description: RW, timer1/2 DMA address loop enable.
    bit_offset: 2
    bit_size: 1

fieldset/CTRL_MOD:
  description: RW, TMR mode control.
  bit_size: 8
  fields:
  - name: TMR_MODE_IN
    description: 'RW, timer in mode: 0=timer/PWM, 1=capture/count.'
    bit_offset: 0
    bit_size: 1
  - name: TMR_ALL_CLEAR
    description: RW, force clear timer FIFO and count.
    bit_offset: 1
    bit_size: 1
  - name: TMR_COUNT_EN
    description: RW, timer count enable.
    bit_offset: 2
    bit_size: 1
  - name: TMR_OUT_EN
    description: RW, timer output enable.
    bit_offset: 3
    bit_size: 1
  - name: TMR_OUT_POLAR__TMR_CAP_COUNT
    description: 'RW, timer PWM output polarity: 0=default low and high action, 1=default high and low action;RW, count sub-mode if RB_TMR_MODE_IN=1: 0=capture, 1=count.'
    bit_offset: 4
    bit_size: 1
  - name: TMR_PWM_REPEAT__TMR_CAP_EDGE
    description: 'RW, timer PWM repeat mode: 00=1, 01=4, 10=8, 11-16;RW, timer capture edge mode: 00=disable, 01=edge change, 10=fall to fall, 11-rise to rise.'
    bit_offset: 6
    bit_size: 2

fieldset/FIFO_COUNT:
  description: RO, TMR FIFO count status.
  bit_size: 8
  fields:
  - name: FIFO_COUNT
    description: RW1, TMR FIFO count status.
    bit_offset: 0
    bit_size: 4

fieldset/INTER_EN:
  description: RW, TMR interrupt enable.
  bit_size: 8
  fields:
  - name: TMR_IE_CYC_END
    description: RW, enable interrupt for timer capture count timeout or PWM cycle end.
    bit_offset: 0
    bit_size: 1
  - name: TMR_IE_DATA_ACT
    description: RW, enable interrupt for timer capture input action or PWM trigger.
    bit_offset: 1
    bit_size: 1
  - name: TMR_IE_FIFO_HF
    description: RW, enable interrupt for timer FIFO half (capture fifo >=4 or PWM fifo less than 3).
    bit_offset: 2
    bit_size: 1
  - name: TMR_IE_DMA_END
    description: RW, enable interrupt for timer1/2 DMA completion.
    bit_offset: 3
    bit_size: 1
  - name: TMR_IE_FIFO_OV
    description: RW, enable interrupt for timer FIFO overflow.
    bit_offset: 4
    bit_size: 1

fieldset/INT_FLAG:
  description: RW1, TMR interrupt flag.
  bit_size: 8
  fields:
  - name: TMR_IF_CYC_END
    description: RW1, interrupt flag for timer capture count timeout or PWM cycle end.
    bit_offset: 0
    bit_size: 1
  - name: TMR_IF_DATA_ACT
    description: RW1, interrupt flag for timer capture input action or PWM trigger.
    bit_offset: 1
    bit_size: 1
  - name: TMR_IF_FIFO_HF
    description: RW1, interrupt flag for timer FIFO half (capture fifo >=4 or PWM fifo less than 3.
    bit_offset: 2
    bit_size: 1
  - name: TMR_IF_DMA_END
    description: RW1, interrupt flag for timer1/2 DMA completion.
    bit_offset: 3
    bit_size: 1
  - name: TMR_IF_FIFO_OV
    description: RW1, interrupt flag for timer FIFO overflow.
    bit_offset: 4
    bit_size: 1

