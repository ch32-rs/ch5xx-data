block/LED:
  description: LED register.
  items:
  - name: R8_LED_CTRL_MOD
    description: RW, LED mode configuration register.
    byte_offset: 0
    bit_size: 8
    fieldset: R8_LED_CTRL_MOD
  - name: R8_LED_CLOCK_DIV
    description: RW, LED serial clock divider register.
    byte_offset: 1
    bit_size: 8
    fieldset: R8_LED_CLOCK_DIV
  - name: R8_LED_STATUS
    description: RW1, LED status register.
    byte_offset: 4
    bit_size: 8
    fieldset: R8_LED_STATUS
  - name: R16_LED_FIFO
    description: WO, LED data FIFO register.
    byte_offset: 8
    access: Write
    bit_size: 16
    fieldset: R16_LED_FIFO
  - name: R16_LED_DMA_CNT
    description: WO, LED DMA transmission length.
    byte_offset: 16
    access: Write
    bit_size: 16
    fieldset: R16_LED_DMA_CNT
  - name: R16_LED_DMA_MAIN
    description: WO, LED main buffer DMA address.
    byte_offset: 20
    access: Write
    bit_size: 16
    fieldset: R16_LED_DMA_MAIN
  - name: R16_LED_DMA_AUX
    description: RW, LED auxiliary buffer DMA address.
    byte_offset: 24
    bit_size: 16
    fieldset: R16_LED_DMA_AUX
fieldset/R16_LED_DMA_AUX:
  description: RW, LED auxiliary buffer DMA address.
  bit_size: 16
  fields:
  - name: R16_LED_DMA_AUX
    description: LED auxiliary buffer DMA address.
    bit_offset: 0
    bit_size: 16
fieldset/R16_LED_DMA_CNT:
  description: WO, LED DMA transmission length.
  bit_size: 16
  fields:
  - name: R16_LED_DMA_CNT
    description: DMA transmission count length.
    bit_offset: 0
    bit_size: 16
fieldset/R16_LED_DMA_MAIN:
  description: WO, LED main buffer DMA address.
  bit_size: 16
  fields:
  - name: R16_LED_DMA_MAIN
    description: LED main buffer DMA address.
    bit_offset: 0
    bit_size: 16
fieldset/R16_LED_FIFO:
  description: WO, LED data FIFO register.
  bit_size: 16
  fields:
  - name: R16_LED_FIFO
    description: LED data FIFO input, 16-bit write.
    bit_offset: 0
    bit_size: 16
fieldset/R8_LED_CLOCK_DIV:
  description: RW, LED serial clock divider register.
  bit_size: 8
  fields:
  - name: R8_LED_CLOCK_DIV
    description: LED output clock frequency division coefficient.
    bit_offset: 0
    bit_size: 8
fieldset/R8_LED_CTRL_MOD:
  description: RW, LED mode configuration register.
  bit_size: 8
  fields:
  - name: RB_LED_BIT_ORDER
    description: Selection of LED serial data bit sequence.
    bit_offset: 0
    bit_size: 1
  - name: RB_LED_ALL_CLEAR
    description: LED FIFO/counter/interrupt flag reset to zero.
    bit_offset: 1
    bit_size: 1
  - name: RB_LED_OUT_POLAR
    description: LED data output polarity control bit.
    bit_offset: 2
    bit_size: 1
  - name: RB_LED_OUT_EN
    description: LED signal output enable.
    bit_offset: 3
    bit_size: 1
  - name: RB_LED_DMA_EN
    description: LED DMA function and DMA interrupt enable.
    bit_offset: 4
    bit_size: 1
  - name: RB_LED_IE_FIFO
    description: FIFO count over half interrupt enabled.
    bit_offset: 5
    bit_size: 1
  - name: RB_LED_CHAN_MOD
    description: LED channel mode selection.
    bit_offset: 6
    bit_size: 2
fieldset/R8_LED_STATUS:
  description: RW1, LED status register.
  bit_size: 8
  fields:
  - name: RB_LED_FIFO_COUNT
    description: The byte count value in the current FIFO must be even.
    bit_offset: 0
    bit_size: 3
  - name: RB_LED_CLOCK
    description: Current LED clock signal level status.
    bit_offset: 4
    bit_size: 1
  - name: RB_LED_IF_FIFO
    description: FIFO count over half interrupt flag, write 1 to reset or write R16_SED_LFO to reset.
    bit_offset: 5
    bit_size: 1
  - name: RB_LED_FIFO_EMPTY
    description: FIFO empty status bit.
    bit_offset: 6
    bit_size: 1
  - name: RB_LED_IF_DMA_END
    description: DMA completion flag bit.
    bit_offset: 7
    bit_size: 1
