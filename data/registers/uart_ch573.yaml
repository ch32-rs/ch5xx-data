# UART on CH573. block/UART_FULL includes MSR/modem (UART0);
# block/UART_NOMODEM is UART1-3.

block/UART_FULL:
  description: UART_FULL register.
  items:
  - name: R8_UART_FULL_MCR
    description: RW, UART_FULL modem control.
    byte_offset: 0
    bit_size: 8
    fieldset: R8_UART_FULL_MCR
  - name: R8_UART_FULL_IER
    description: RW, UART_FULL interrupt enable.
    byte_offset: 1
    bit_size: 8
    fieldset: R8_UART_FULL_IER
  - name: R8_UART_FULL_FCR
    description: RW, UART_FULL FIFO control.
    byte_offset: 2
    bit_size: 8
    fieldset: R8_UART_FULL_FCR
  - name: R8_UART_FULL_LCR
    description: RW, UART_FULL line control.
    byte_offset: 3
    bit_size: 8
    fieldset: R8_UART_FULL_LCR
  - name: R8_UART_FULL_IIR
    description: RO, UART_FULL interrupt identification.
    byte_offset: 4
    access: Read
    bit_size: 8
    fieldset: R8_UART_FULL_IIR
  - name: R8_UART_FULL_LSR
    description: RO, UART_FULL line status.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: R8_UART_FULL_LSR
  - name: R8_UART_FULL_MSR
    description: RO, UART_FULL modem status.
    byte_offset: 6
    access: Read
    bit_size: 8
    fieldset: R8_UART_FULL_MSR
  - name: R8_UART_FULL_RBR
    description: RO, UART_FULL receiver buffer, receiving byte.
    byte_offset: 8
    access: Read
    bit_size: 8
    fieldset: R8_UART_FULL_RBR
  - name: R8_UART_FULL_THR
    description: WO, UART_FULL transmitter holding, transmittal byte.
    byte_offset: 8
    access: Write
    bit_size: 8
    fieldset: R8_UART_FULL_THR
  - name: R8_UART_FULL_RFC
    description: RO, UART_FULL receiver FIFO count.
    byte_offset: 10
    access: Read
    bit_size: 8
    fieldset: R8_UART_FULL_RFC
  - name: R8_UART_FULL_TFC
    description: RO, UART_FULL transmitter FIFO count.
    byte_offset: 11
    access: Read
    bit_size: 8
    fieldset: R8_UART_FULL_TFC
  - name: R16_UART_FULL_DL
    description: RW, UART_FULL divisor latch.
    byte_offset: 12
    bit_size: 16
    fieldset: R16_UART_FULL_DL
  - name: R8_UART_FULL_DIV
    description: RW, UART_FULL pre-divisor latch byte, only low 7 bit, from 1 to 0/128.
    byte_offset: 14
    bit_size: 8
    fieldset: R8_UART_FULL_DIV
  - name: R8_UART_FULL_ADR
    description: 'RW, UART_FULL slave address: 0xFF=disable, other=enable.'
    byte_offset: 15
    bit_size: 8
    fieldset: R8_UART_FULL_ADR

