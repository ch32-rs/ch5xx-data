    description: RW, SPI_FULL DMA enable.
    bit_offset: 0
    bit_size: 1
  - name: RB_SPI_DMA_LOOP
    description: RW, SPI_FULL DMA address loop enable.
    bit_offset: 2
    bit_size: 1
  - name: RB_SPI_AUTO_IF
    description: RW, enable buffer/FIFO accessing to auto clear RB_SPI_IF_BYTE_END interrupt flag.
    bit_offset: 4
    bit_size: 1
  - name: RB_SPI_BIT_ORDER
    description: 'RW, SPI bit data order: 0=MSB first, 1=LSB first.'
    bit_offset: 5
    bit_size: 1
  - name: RB_SPI_MST_DLY_EN
    description: RW, SPI master input delay enable.
    bit_offset: 6
    bit_size: 1
fieldset/R8_SPI_FULL_CTRL_MOD:
  description: RW, SPI_FULL mode control.
  bit_size: 8
  fields:
  - name: RB_SPI_MODE_SLAVE
    description: 'RW, SPI_FULL slave mode: 0=master or host, 1=slave or device.'
    bit_offset: 0
    bit_size: 1
  - name: RB_SPI_ALL_CLEAR
    description: RW, force clear SPI FIFO and count.
    bit_offset: 1
    bit_size: 1
  - name: RB_SPI_2WIRE_MOD
    description: 'RW, SPI_FULL enable 2 wire mode for slave: 0=3wire(SCK0,MOSI,MISO), 1=2wire(SCK0,MISO=MXSX).'
    bit_offset: 2
    bit_size: 1
  - name: RB_SPI_MST_SCK_MOD__SPI_SLV_CMD_MOD
    description: 'RW, SPI master clock mode: 0=mode 0, 1=mode 3;RW, SPI_FULL slave command mode: 0=byte stream, 1=first byte command.'
    bit_offset: 3
    bit_size: 1
  - name: RB_SPI_FIFO_DIR
    description: 'RW, SPI FIFO direction: 0=out(write @master mode), 1=in(read @master mode).'
    bit_offset: 4
    bit_size: 1
  - name: RB_SPI_SCK_OE
    description: RW, SPI SCK output enable.
    bit_offset: 5
    bit_size: 1
  - name: RB_SPI_MOSI_OE
    description: RW, SPI MOSI output enable.
    bit_offset: 6
    bit_size: 1
  - name: RB_SPI_MISO_OE
    description: RW, SPI MISO output enable.
    bit_offset: 7
    bit_size: 1
