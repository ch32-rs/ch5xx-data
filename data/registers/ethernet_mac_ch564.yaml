fieldset/CHKSUM_CR:
  description: CHKSUM configure register.
  fields:
  - name: Byte_En1
    description: Participate in the ip header checksum to. calculate byte control bits.
    bit_offset: 0
    bit_size: 4
  - name: Byte_En2
    description: Participate in the ip header checksum to. calculate byte control bits.
    bit_offset: 4
    bit_size: 4
  - name: Chksum_En
    description: the software sets 1 at the beginning of frame calculation. and write 0  at the end of frame calculation.
    bit_offset: 8
    bit_size: 1
fieldset/CHKSUM_HR:
  description: IP packet register.
  fields:
  - name: Chksum_Head_Result
    description: IP header checksum.
    bit_offset: 0
    bit_size: 16
fieldset/CHKSUM_PR:
  description: IP data register.
  fields:
