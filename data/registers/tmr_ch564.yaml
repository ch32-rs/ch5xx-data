# Timer on CH564. block/TMR_FULL has DMA (TMR0-2); block/TMR_NODMA is TMR3.

block/TMR_FULL:
  description: TMR_FULL register.
  items:
  - name: CTRL_MOD
    description: TMR_FULL mode control.
    byte_offset: 0
    bit_size: 8
    fieldset: CTRL_MOD_FULL
  - name: CTRL_DMA
    description: TMR_FULL DMA control register.
    byte_offset: 1
    bit_size: 8
    fieldset: CTRL_DMA
  - name: INTER_EN
    description: TMR_FULL interrupt enable.
    byte_offset: 2
    bit_size: 8
    fieldset: INTER_EN_FULL
  - name: INT_FLAG
    description: TMR_FULL interrupt flag.
    byte_offset: 6
    bit_size: 8
    fieldset: INT_FLAG
  - name: FIFO_COUNT
    description: TMR_FULL FIFO count status.
    byte_offset: 7
    access: Read
    bit_size: 8
    fieldset: FIFO_COUNT
  - name: COUNT
    description: TMR_FULL current count.
    byte_offset: 8
    access: Read
    fieldset: COUNT
  - name: CNT_END
    description: TMR_FULL end count value, only low 28 bit.
    byte_offset: 12
    fieldset: CNT_END
  - name: FIFO
    description: TMR_FULL FIFO register, only low 28 bit.
    byte_offset: 16
    fieldset: FIFO
  - name: DMA_NOW
    description: DMA current buffer address register.
    byte_offset: 20
    access: Read
    fieldset: DMA_NOW
  - name: DMA_BEG
    description: DMA start buffer address register.
    byte_offset: 24
    fieldset: DMA_BEG
  - name: DMA_END
    description: DMA end buffer address register.
    byte_offset: 28
    fieldset: DMA_END

block/TMR_NODMA:
  description: TMR_NODMA register.
  items:
  - name: CTRL_MOD
    description: TMR_NODMA mode control.
    byte_offset: 0
    bit_size: 8
    fieldset: CTRL_MOD_NODMA
  - name: INTER_EN
    description: TMR_NODMA interrupt enable.
    byte_offset: 2
    bit_size: 8
    fieldset: INTER_EN_NODMA
  - name: INT_FLAG
    description: TMR_NODMA interrupt flag.
    byte_offset: 6
    bit_size: 8
    fieldset: INT_FLAG
  - name: FIFO_COUNT
    description: TMR_NODMA FIFO count status.
    byte_offset: 7
    access: Read
    bit_size: 8
    fieldset: FIFO_COUNT
  - name: COUNT
    description: TMR_NODMA current count.
    byte_offset: 8
    access: Read
    fieldset: COUNT
  - name: CNT_END
    description: TMR_NODMA end count value, only low 28 bit.
    byte_offset: 12
    fieldset: CNT_END
  - name: FIFO
    description: TMR_NODMA FIFO register, only low 28 bit.
    byte_offset: 16
    fieldset: FIFO

fieldset/CNT_END:
  description: TMR_FULL end count value, only low 28 bit.
  fields:
  - name: CNT_END
    description: The number of timer ticks in timer mode.
    bit_offset: 0
    bit_size: 28

fieldset/COUNT:
  description: TMR_FULL current count.
  fields:
  - name: COUNT
    description: TMR_FULL current count.
    bit_offset: 0
    bit_size: 28

fieldset/DMA_BEG:
  description: DMA start buffer address register.
  fields:
  - name: DMA_BEG
    description: DMA start buffer address.
    bit_offset: 0
    bit_size: 18

fieldset/DMA_END:
  description: DMA end buffer address register.
  fields:
  - name: DMA_END
    description: DMA end buffer address.
    bit_offset: 0
    bit_size: 18

fieldset/DMA_NOW:
  description: DMA current buffer address register.
  fields:
  - name: DMA_NOW
    description: DMA current buffer address.
    bit_offset: 0
    bit_size: 18

fieldset/FIFO:
  description: TMR_FULL FIFO register, only low 28 bit.
  fields:
  - name: FIFO
    description: TMR_FULL FIFO current count.
    bit_offset: 0
    bit_size: 28

fieldset/CTRL_DMA:
  description: TMR_FULL DMA control register.
  bit_size: 8
  fields:
  - name: DMA_ENABLE
    description: DMA function enable.
    bit_offset: 0
    bit_size: 1
  - name: DMA_BURST
    description: DMA burst operation.
    bit_offset: 1
    bit_size: 1
  - name: DMA_LOOP
    description: DMA address round-robin mode enabled.
    bit_offset: 2
    bit_size: 1

fieldset/CTRL_MOD_FULL:
  description: TMR_FULL mode control.
  bit_size: 8
  fields:
  - name: MODE_IN
    description: timer in mode.
    bit_offset: 0
    bit_size: 1
  - name: ALL_CLEAR
    description: force clear timer FIFO and count.
    bit_offset: 1
    bit_size: 1
  - name: COUNT_EN
    description: timer count enable.
    bit_offset: 2
    bit_size: 1
  - name: OUT_EN
    description: timer output enable.
    bit_offset: 3
    bit_size: 1
  - name: OUT_POLAR_RB_CAT_WIDTH
    description: timer PWM output polarity / Capture pulse width.
    bit_offset: 4
    bit_size: 1
  - name: MODE_NRZI
    description: timer serial codec mode.
    bit_offset: 5
    bit_size: 1
  - name: PWM_REPEAT_RB_CATCH_EDGE
    description: timer PWM repeat mode / timer capture edge mode.
    bit_offset: 6
    bit_size: 2

fieldset/FIFO_COUNT:
  description: TMR_FULL FIFO count status.
  bit_size: 8
  fields:
  - name: FIFO_COUNT
    description: TMR_FULL FIFO count status.
    bit_offset: 0
    bit_size: 8

fieldset/INTER_EN_FULL:
  description: TMR_FULL interrupt enable.
  bit_size: 8
  fields:
  - name: IE_CYC_END
    description: enable interrupt for timer capture count timeout or PWM. cycle end.
    bit_offset: 0
    bit_size: 1
  - name: IE_DATA_ACT
    description: enable interrupt for timer capture input action or PWM. trigger.
    bit_offset: 1
    bit_size: 1
  - name: IE_FIFO_HF
    description: enable interrupt for timer FIFO half (capture fifo >=4 or. PWM fifo lower than3).
    bit_offset: 2
    bit_size: 1
  - name: IE_DMA_END
    description: enable interrupt for timer DMA completion.
    bit_offset: 3
    bit_size: 1
  - name: IE_FIFO_OV
    description: enable interrupt for timer FIFO overflow.
    bit_offset: 4
    bit_size: 1
  - name: IE_DMA_ERR
    description: enable DMA error responde interrupt.
    bit_offset: 5
    bit_size: 1

fieldset/INT_FLAG:
  description: TMR_FULL interrupt flag.
  bit_size: 8
  fields:
  - name: IF_CYC_END
    description: interrupt flag for timer capture count timeout or PWM cycle. end.
    bit_offset: 0
    bit_size: 1
  - name: IF_DATA_ACT
    description: interrupt flag for timer capture input action or PWM. trigger.
    bit_offset: 1
    bit_size: 1
  - name: IF_FIFO_HF
    description: interrupt flag for timer FIFO half.
    bit_offset: 2
    bit_size: 1
  - name: IF_DMA_END
    description: interrupt flag for timer DMA completion.
    bit_offset: 3
    bit_size: 1
  - name: IF_FIFO_OV
    description: interrupt flag for timer FIFO overflow.
    bit_offset: 4
    bit_size: 1
  - name: IF_DMA_ERR
    description: DMA error responde flag.
    bit_offset: 5
    bit_size: 1

fieldset/CTRL_MOD_NODMA:
  description: TMR_NODMA mode control.
  bit_size: 8
  fields:
  - name: MODE_IN
    description: timer in mode.
    bit_offset: 0
    bit_size: 1
  - name: ALL_CLEAR
    description: force clear timer FIFO and count.
    bit_offset: 1
    bit_size: 1
  - name: COUNT_EN
    description: timer count enable.
    bit_offset: 2
    bit_size: 1
  - name: OUT_EN
    description: timer output enable.
    bit_offset: 3
    bit_size: 1
  - name: OUT_POLAR_RB_CAP_WIDTH
    description: timer PWM output polarity / Capture pulse width.
    bit_offset: 4
    bit_size: 1
  - name: MODE_COUNT
    description: external clock counter mode.
    bit_offset: 5
    bit_size: 1
  - name: PWM_REPEAT_RB_CAP_EDGE
    description: timer PWM repeat mode / timer capture edge mode.
    bit_offset: 6
    bit_size: 2

fieldset/INTER_EN_NODMA:
  description: TMR_NODMA interrupt enable.
  bit_size: 8
  fields:
  - name: IE_CYC_END
    description: enable interrupt for timer capture count timeout or PWM. cycle end.
    bit_offset: 0
    bit_size: 1
  - name: IE_DATA_ACT
    description: enable interrupt for timer capture input action or PWM. trigger.
    bit_offset: 1
    bit_size: 1
  - name: IE_FIFO_HF
    description: enable interrupt for timer FIFO half (capture fifo >=4 or. PWM fifo lower than3).
    bit_offset: 2
    bit_size: 1
  - name: IE_DMA_END
    description: enable interrupt for timer DMA completion.
    bit_offset: 3
    bit_size: 1
  - name: IE_FIFO_OV
    description: enable interrupt for timer FIFO overflow.
    bit_offset: 4
    bit_size: 1
  - name: IE_DMA_ERR
    description: enable DMA error responde interrupt.
    bit_offset: 5
    bit_size: 1
  - name: FORCE_EN
    description: Forcibly enable TIMER0,TIMER1 and TIMER2 at the same time.
    bit_offset: 7
    bit_size: 1

