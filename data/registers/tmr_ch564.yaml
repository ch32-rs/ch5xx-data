    bit_offset: 0
    bit_size: 8

fieldset/R8_TMR_NODMA_INTER_EN:
  description: TMR_NODMA interrupt enable.
  bit_size: 8
  fields:
  - name: RB_TMR_IE_CYC_END
    description: enable interrupt for timer capture count timeout or PWM. cycle end.
    bit_offset: 0
    bit_size: 1
  - name: RB_TMR_IE_DATA_ACT
