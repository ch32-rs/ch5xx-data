    bit_offset: 6
    bit_size: 1
  - name: UEP_R_TOG
    description: 'expected data toggle flag of USB endpoint X receiving (OUT): 0=DATA0, 1=DATA1;RB_UH_PRE_PID_EN;USB host PRE PID enable for low speed device via hub.'
    bit_offset: 7
    bit_size: 1
