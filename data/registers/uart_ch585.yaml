# UART. block/UART_FULL includes MSR/modem/address (all CH58x UARTs,
# UART0 on CH592/CH595). block/UART_NOMODEM is the reduced UART1-3 layout
# on CH592/CH595.

block/UART_FULL:
  description: UART register.
  items:
  - name: R8_UART_MCR
    description: RW, UART modem control.
    byte_offset: 0
    bit_size: 8
    fieldset: R8_UART_MCR
  - name: R8_UART_IER
    description: RW, UART interrupt enable.
    byte_offset: 1
    bit_size: 8
    fieldset: R8_UART_IER
  - name: R8_UART_FCR
    description: RW, UART FIFO control.
    byte_offset: 2
    bit_size: 8
    fieldset: R8_UART_FCR
  - name: R8_UART_LCR
    description: RW, UART line control.
    byte_offset: 3
    bit_size: 8
    fieldset: R8_UART_LCR
  - name: R8_UART_IIR
    description: RO, UART interrupt identification.
    byte_offset: 4
    access: Read
    bit_size: 8
    fieldset: R8_UART_IIR
  - name: R8_UART_LSR
    description: RO, UART line status.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: R8_UART_LSR
  - name: R8_UART_MSR
    description: RO, UART modem status.
    byte_offset: 6
    access: Read
    bit_size: 8
    fieldset: R8_UART_MSR
  - name: R8_UART_RBR
    description: RO, UART receiver buffer, receiving byte.
    byte_offset: 8
    access: Read
    bit_size: 8
    fieldset: R8_UART_RBR
  - name: R8_UART_THR
    description: WO, UART transmitter holding, transmittal byte.
    byte_offset: 8
    access: Write
    bit_size: 8
    fieldset: R8_UART_THR
  - name: R8_UART_RFC
    description: RO, UART receiver FIFO count.
    byte_offset: 10
    access: Read
    bit_size: 8
    fieldset: R8_UART_RFC
  - name: R8_UART_TFC
    description: RO, UART transmitter FIFO count.
    byte_offset: 11
    access: Read
    bit_size: 8
    fieldset: R8_UART_TFC
  - name: R16_UART_DL
    description: RW, UART divisor latch.
    byte_offset: 12
    bit_size: 16
    fieldset: R16_UART_DL
  - name: R8_UART_DIV
    description: RW, UART pre-divisor latch byte, only low 7 bit, from 1 to 0/128.
    byte_offset: 14
    bit_size: 8
    fieldset: R8_UART_DIV
  - name: R8_UART_ADR
    description: 'RW, UART slave address: 0xFF=disable, other=enable.'
    byte_offset: 15
    bit_size: 8
    fieldset: R8_UART_ADR

