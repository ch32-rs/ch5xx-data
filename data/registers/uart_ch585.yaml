# UART. block/UART_FULL includes MSR/modem/address (all CH58x UARTs,
# UART0 on CH592/CH595). block/UART_NOMODEM is the reduced UART1-3 layout
# on CH592/CH595.

block/UART_FULL:
  description: UART register.
  items:
  - name: MCR
    description: RW, UART modem control.
    byte_offset: 0
    bit_size: 8
    fieldset: MCR
  - name: IER
    description: RW, UART interrupt enable.
    byte_offset: 1
    bit_size: 8
    fieldset: IER
  - name: FCR
    description: RW, UART FIFO control.
    byte_offset: 2
    bit_size: 8
    fieldset: FCR
  - name: LCR
    description: RW, UART line control.
    byte_offset: 3
    bit_size: 8
    fieldset: LCR
  - name: IIR
    description: RO, UART interrupt identification.
    byte_offset: 4
    access: Read
    bit_size: 8
    fieldset: IIR
  - name: LSR
    description: RO, UART line status.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: LSR
  - name: MSR
    description: RO, UART modem status.
    byte_offset: 6
    access: Read
    bit_size: 8
    fieldset: MSR
  - name: RBR
    description: RO, UART receiver buffer, receiving byte.
    byte_offset: 8
    access: Read
    bit_size: 8
    fieldset: RBR
  - name: THR
    description: WO, UART transmitter holding, transmittal byte.
    byte_offset: 8
    access: Write
    bit_size: 8
    fieldset: THR
  - name: RFC
    description: RO, UART receiver FIFO count.
    byte_offset: 10
    access: Read
    bit_size: 8
    fieldset: RFC
  - name: TFC
    description: RO, UART transmitter FIFO count.
    byte_offset: 11
    access: Read
    bit_size: 8
    fieldset: TFC
  - name: DL
    description: RW, UART divisor latch.
    byte_offset: 12
    bit_size: 16
    fieldset: DL
  - name: DIV
    description: RW, UART pre-divisor latch byte, only low 7 bit, from 1 to 0/128.
    byte_offset: 14
    bit_size: 8
    fieldset: DIV
  - name: ADR
    description: 'RW, UART slave address: 0xFF=disable, other=enable.'
    byte_offset: 15
    bit_size: 8
    fieldset: ADR

block/UART_NOMODEM:
  description: UART register.
  items:
  - name: MCR
    description: RW, UART modem control.
    byte_offset: 0
