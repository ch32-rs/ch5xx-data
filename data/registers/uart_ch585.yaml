    description: RW, UART interrupt enable.
    byte_offset: 1
    bit_size: 8
    fieldset: IER
  - name: FCR
    description: RW, UART FIFO control.
    byte_offset: 2
    bit_size: 8
    fieldset: FCR
  - name: LCR
    description: RW, UART line control.
    byte_offset: 3
    bit_size: 8
    fieldset: LCR
  - name: IIR
    description: RO, UART interrupt identification.
    byte_offset: 4
    access: Read
    bit_size: 8
    fieldset: IIR
  - name: LSR
    description: RO, UART line status.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: LSR
  - name: RBR
    description: RO, UART receiver buffer, receiving byte.
    byte_offset: 8
    access: Read
    bit_size: 8
    fieldset: RBR
  - name: THR
    description: WO, UART transmitter holding, transmittal byte.
    byte_offset: 8
    access: Write
    bit_size: 8
    fieldset: THR
  - name: RFC
    description: RO, UART receiver FIFO count.
    byte_offset: 10
    access: Read
    bit_size: 8
    fieldset: RFC
  - name: TFC
    description: RO, UART transmitter FIFO count.
