block/USBHS_DEV:
  description: USB register.
  items:
  - name: CTRL
    description: USB base control register.
    byte_offset: 0
    bit_size: 8
    fieldset: CTRL
  - name: BASE_MODE
    description: USB mode control register.
    byte_offset: 1
    bit_size: 8
    fieldset: BASE_MODE
  - name: INT_EN
    description: USB interrupt enable register.
    byte_offset: 2
    bit_size: 8
    fieldset: INT_EN
  - name: DEV_AD
    description: USB device address.
    byte_offset: 3
    bit_size: 8
    fieldset: DEV_AD
  - name: WAKE_CTRL
    description: USB remote wake up register.
    byte_offset: 4
    access: Read
    bit_size: 16
    fieldset: WAKE_CTRL
  - name: TEST_MODE
    description: USB test mode register.
    byte_offset: 5
    bit_size: 8
    fieldset: TEST_MODE
  - name: LPM_DATA
    description: USB power management register.
    byte_offset: 6
    bit_size: 16
    fieldset: LPM_DATA
  - name: INT_FG
    description: USB interrupt flag register.
    byte_offset: 8
    bit_size: 8
    fieldset: INT_FG
  - name: INT_ST
    description: USB interrupt status.
    byte_offset: 9
    access: Read
    bit_size: 8
    fieldset: INT_ST
  - name: MIS_ST
    description: USB miscellaneous status.
    byte_offset: 10
    access: Read
    bit_size: 8
    fieldset: MIS_ST
  - name: FRAM_NO
    description: USB frame number.
    byte_offset: 12
    access: Read
    bit_size: 16
    fieldset: FRAM_NO
  - name: BUS
    description: USB bus.
    byte_offset: 14
    bit_size: 16
    fieldset: BUS
  - name: UEP_TX_EN
    description: USB endpoint sends the enable register.
    byte_offset: 16
    bit_size: 16
    fieldset: UEP_TX_EN
  - name: UEP_RX_EN
    description: USB endpoint receive the enable registers.
    byte_offset: 18
    bit_size: 16
    fieldset: UEP_RX_EN
  - name: UEP_T_TOG_AUTO
    description: USB endpoint sends the auto-filp enable register.
    byte_offset: 20
    bit_size: 16
    fieldset: UEP_T_TOG_AUTO
  - name: UEP_R_TOG_AUTO
    description: USB endpoint receive the auto-filp enable register.
    byte_offset: 22
    bit_size: 16
    fieldset: UEP_R_TOG_AUTO
  - name: UEP_T_BURST
    description: USB endpoint sends a burst register.
    byte_offset: 24
    bit_size: 8
    fieldset: UEP_T_BURST
  - name: UEP_T_BURST_MODE
    description: USB endpoint send the mode register.
    byte_offset: 25
    bit_size: 8
    fieldset: UEP_T_BURST_MODE
  - name: UEP_R_BURST
    description: USB endpoint receives the burst register.
    byte_offset: 26
    bit_size: 8
    fieldset: UEP_R_BURST
  - name: UEP_R_RES_MODE
    description: USB endpoint reply mode register.
    byte_offset: 27
    bit_size: 8
    fieldset: UEP_R_RES_MODE
  - name: UEP_AF_MODE
    description: USB endpoint muitiplexing register.
    byte_offset: 28
    fieldset: UEP_AF_MODE
  - name: UEP0_DMA
    description: The start address register of the endpoint 0 buffer.
    byte_offset: 32
    fieldset: UEP0_DMA
  - name: UEP_RX_DMA
    description: endpoint n (n=1..7) receives the start address register of the buffer. Array index 0..6 maps to endpoint 1..7.
    byte_offset: 36
    fieldset: UEP_RX_DMA
    array:
      len: 7
      stride: 4
  - name: UEP_TX_DMA
    description: endpoint n (n=1..7) sends the start address register of the buffer. Array index 0..6 maps to endpoint 1..7.
    byte_offset: 64
    fieldset: UEP_TX_DMA
    array:
      len: 7
      stride: 4
  - name: UEP0_MAX_LEN
    description: endpoint 0 max length packet register.
    byte_offset: 92
    fieldset: UEP0_MAX_LEN
  - name: UEP_MAX_LEN
    description: endpoint n (n=1..7) max length packet register. Array index 0..6 maps to endpoint 1..7.
    byte_offset: 96
    fieldset: UEP_MAX_LEN
    array:
      len: 7
      stride: 4
  - name: UEP0_RX_LEN
    description: endpoint 0 acceptable length.
    byte_offset: 124
    bit_size: 16
    fieldset: UEP0_RX_LEN
  - name: UEP_RX_LEN
    description: endpoint n (n=1..7) receives the lenth register in a single pass. Array index 0..6 maps to endpoint 1..7.
    byte_offset: 128
    bit_size: 16
    fieldset: UEP_RX_LEN
    array:
      len: 7
      stride: 4
  - name: UEP_R_SIZE
    description: the length register of the total received data at endpoint n (n=1..7). Array index 0..6 maps to endpoint 1..7.
    byte_offset: 130
    bit_size: 16
    fieldset: UEP_R_SIZE
    array:
      len: 7
      stride: 4
  - name: UEP0_T_LEN
    description: endpoint 0 send the length.
    byte_offset: 156
    bit_size: 16
    fieldset: UEP0_T_LEN
  - name: UEP0_TX_CTRL
    description: endpoint 0 send control register.
    byte_offset: 158
    bit_size: 8
    fieldset: UEP0_TX_CTRL
  - name: UEP0_RX_CTRL
    description: endpoint 0 send control register.
    byte_offset: 159
    bit_size: 8
    fieldset: UEP0_RX_CTRL
  - name: UEP_T_LEN
    description: endpoint n (n=1..7) send the length register. Array index 0..6 maps to endpoint 1..7.
    byte_offset: 160
    bit_size: 16
    fieldset: UEP_T_LEN
    array:
      len: 7
      stride: 4
  - name: UEP_TX_CTRL
    description: endpoint n (n=1..7) send control register. Array index 0..6 maps to endpoint 1..7.
    byte_offset: 162
    bit_size: 8
    fieldset: UEP_TX_CTRL
    array:
      len: 7
      stride: 4
  - name: UEP_RX_CTRL
    description: endpoint n (n=1..7) receive control. Array index 0..6 maps to endpoint 1..7.
    byte_offset: 163
    bit_size: 8
    fieldset: UEP_RX_CTRL
    array:
      len: 7
      stride: 4
  - name: UEP_T_ISO
    description: usb endpoint sends a synchronous mode enable register.
    byte_offset: 188
    bit_size: 16
    fieldset: UEP_T_ISO
  - name: UEP_R_ISO
    description: usb endpoint receives a synchronous mode enable register.
    byte_offset: 190
    bit_size: 16
    fieldset: UEP_R_ISO
fieldset/LPM_DATA:
  description: USB power management register.
  bit_size: 16
  fields:
  - name: LPM_DATA
    description: power management data.
    bit_offset: 0
    bit_size: 11
  - name: LPM_BUSY
    description: power management busy.
    bit_offset: 15
    bit_size: 1
fieldset/BUS:
  description: USB bus.
  bit_size: 16
  fields:
  - name: WAKEUP
    description: USB wakeup.
    bit_offset: 0
    bit_size: 1
  - name: DP_ST
    description: UDP status.
    bit_offset: 2
    bit_size: 1
  - name: DM_ST
    description: UDM status.
    bit_offset: 3
    bit_size: 1
fieldset/FRAM_NO:
  description: USB frame number.
  bit_size: 16
  fields:
  - name: FRAME_NO
    description: Received frame number.
    bit_offset: 0
    bit_size: 11
  - name: MICRO_FRAME
    description: Received micro frame number.
    bit_offset: 13
    bit_size: 3
fieldset/BASE_MODE:
  description: USB mode control register.
  bit_size: 8
  fields:
  - name: EXP_SPD
    description: The desired speed mode of the device.
    bit_offset: 0
    bit_size: 2
fieldset/CTRL:
  description: USB base control register.
  bit_size: 8
  fields:
  - name: LINK_RESET
    description: LINK layer reset,highly effective.
    bit_offset: 0
    bit_size: 1
  - name: SIE_RESET
    description: USB protocol processor reset.
    bit_offset: 1
    bit_size: 1
  - name: ALL_CLR
    description: clear all interrupt flags.
    bit_offset: 2
    bit_size: 1
  - name: PHY_SUSPENDM
    description: USB PHY suspend.
    bit_offset: 3
    bit_size: 1
  - name: DEV_DMA_EN
    description: DMA transfer enabled.
    bit_offset: 4
    bit_size: 1
  - name: DEV_EN
    description: USB device enabled.
    bit_offset: 5
    bit_size: 1
  - name: DEV_LPM_EN
    description: LPM enable.
    bit_offset: 7
    bit_size: 1
fieldset/DEV_AD:
  description: USB device address.
  bit_size: 8
  fields:
  - name: MASK_USB_ADDR
    description: bit mask for USB device address.
    bit_offset: 0
    bit_size: 7
fieldset/INT_EN:
  description: USB interrupt enable register.
  bit_size: 8
  fields:
  - name: BUS_REST_IE
    description: USB bus reset interrupt enabled.
    bit_offset: 0
    bit_size: 1
  - name: BUS_SUSP_IE
    description: USB bus pause interrupt enabled.
    bit_offset: 1
    bit_size: 1
  - name: BUS_SLEEP_IE
    description: USB bus sleep interrupt enabled.
    bit_offset: 2
    bit_size: 1
  - name: LPM_ACT_IE
    description: LMP transfer end interrupt enabled.
    bit_offset: 3
    bit_size: 1
  - name: RTX_ACT_IE
    description: USB transfer end interrupt enabled.
    bit_offset: 4
    bit_size: 1
  - name: RX_SOF_IE
    description: Receive SOF packet interrupt enable.
    bit_offset: 5
    bit_size: 1
  - name: LINK_RDY_IE
    description: USB connection interrupt enable.
    bit_offset: 6
    bit_size: 1
  - name: FIFO_OVER_IE
    description: USB Overflow interrupt enable.
    bit_offset: 7
    bit_size: 1
fieldset/INT_FG:
  description: USB interrupt flag register.
  bit_size: 8
  fields:
  - name: UIF_BUS_RST
    description: USB bus reset interrupt flag.
    bit_offset: 0
    bit_size: 1
  - name: UIF_SUSPEND
    description: USB bus suspend interrupt flag.
    bit_offset: 1
    bit_size: 1
  - name: UIF_BUS_SLEEP
    description: USB bus sleep interrupt flag.
    bit_offset: 2
    bit_size: 1
  - name: UIF_LPM_ACT
    description: LPM transmission end interrupt flag.
    bit_offset: 3
    bit_size: 1
  - name: UIF_RTX_ACT
    description: USB transmission end interrupt flag.
    bit_offset: 4
    bit_size: 1
  - name: UIF_RX_SOF
    description: Receive SOF packet interrupt flag.
    bit_offset: 5
    bit_size: 1
  - name: UIF_LINK_RDY
    description: USB connection interrupt flag.
    bit_offset: 6
    bit_size: 1
  - name: UIF_FIFO_OV
    description: USB Overflow interrupt flag.
    bit_offset: 7
    bit_size: 1
fieldset/INT_ST:
  description: USB interrupt status.
  bit_size: 8
  fields:
  - name: UIS_EP_ID_MASK
    description: The endpoint number at which the data transfer occurs.
    bit_offset: 0
    bit_size: 3
  - name: UIS_EP_DIR
    description: Endpoint data transmission direction.
    bit_offset: 4
    bit_size: 1
fieldset/MIS_ST:
  description: USB miscellaneous status.
  bit_size: 8
  fields:
  - name: UMS_READY
    description: USB connection status.
    bit_offset: 0
    bit_size: 1
  - name: UMS_SUSPEND
    description: USB suspend status.
    bit_offset: 1
    bit_size: 1
  - name: UMS_SLEEP
    description: USB sleep status.
    bit_offset: 2
    bit_size: 1
  - name: UMS_FREE
    description: USB free status.
    bit_offset: 3
    bit_size: 1
  - name: UMS_SUSP_REQ
    description: USB suspends the request.
    bit_offset: 4
    bit_size: 1
  - name: UMS_HS_MOD
    description: whether the host is high-speed.
    bit_offset: 7
    bit_size: 1
fieldset/TEST_MODE:
  description: USB test mode register.
  bit_size: 8
  fields:
  - name: TEST_J
    description: test mode,output J.
    bit_offset: 0
    bit_size: 1
  - name: TEST_K
    description: test mode,output K.
    bit_offset: 1
    bit_size: 1
  - name: TEST_PKT
    description: test mode,output a packet.
    bit_offset: 2
    bit_size: 1
  - name: TEST_SE0NAK
    description: test mode,output SEO.
    bit_offset: 3
    bit_size: 1
  - name: TEST_EN
    description: test mode enable.
    bit_offset: 7
    bit_size: 1
fieldset/WAKE_CTRL:
  description: USB remote wake up register.
  bit_size: 16
  fields:
  - name: RMT_WAKE
    description: remote wake up.
    bit_offset: 0
    bit_size: 1
fieldset/UEP0_DMA:
  description: The start address register of the endpoint 0 buffer.
  fields:
  - name: UEP0_DMA
    description: The start address of the endpoint 0 buffer.
    bit_offset: 0
    bit_size: 17
fieldset/UEP0_MAX_LEN:
  description: endpoint 0 max length packet register.
  fields:
  - name: UEP0_MAX_LEN
    description: endpoint 0 max acceptable offset length.
    bit_offset: 0
    bit_size: 7
fieldset/UEP0_RX_CTRL:
  description: endpoint 0 send control register.
  bit_size: 8
  fields:
  - name: RES_MASK
    description: endpoint 0 has control over the received response.
    bit_offset: 0
    bit_size: 2
  - name: UEP_TOG_MASK
    description: the reception of endpoint 0 expects a synchronous trigger. bit.
    bit_offset: 2
    bit_size: 1
  - name: SETUP_IS
    description: whether endpoint 0 receives a SETUP transaction.
    bit_offset: 3
    bit_size: 1
  - name: ENDP_R_TOG_MATCH
    description: received synchronization trigger bit matches the desired. synchronization trigger bit state.
    bit_offset: 4
    bit_size: 1
  - name: UEP_R_NAK_TOG
    description: endpoint 0 for the received return NAK,packet type.
    bit_offset: 5
    bit_size: 1
  - name: UEP_R_NAK_ACT
    description: endpoint 0 receives the end of NAK flag.
    bit_offset: 6
    bit_size: 1
  - name: ENDP_R_DONE
    description: endpoint 0 receives the end flag.
    bit_offset: 7
    bit_size: 1
fieldset/UEP0_RX_LEN:
  description: endpoint 0 acceptable length.
  bit_size: 16
  fields:
  - name: UEP0_RX_LEN
    description: endpoint 0 acceptable data length.
    bit_offset: 0
    bit_size: 7
fieldset/UEP0_TX_CTRL:
  description: endpoint 0 send control register.
  bit_size: 8
  fields:
  - name: RES_MASK
    description: endpoint 0 control of the send response to IN transactions.
    bit_offset: 0
    bit_size: 2
  - name: EP_TOG_MASK
    description: endpoint 0 synchronous trigger bit for the sender to. prepare.
    bit_offset: 2
    bit_size: 2
  - name: UEP_T_NAK_ACT
    description: endpoint 0 sends the end flag.
    bit_offset: 6
    bit_size: 1
  - name: ENDP_T_DONE
    description: endpoint 0 sends the end of NAK flag.
    bit_offset: 7
    bit_size: 1
fieldset/UEP0_T_LEN:
  description: endpoint 0 send the length.
  bit_size: 16
  fields:
  - name: UEP0_T_LEN
    description: endpoint 0 send the length.
    bit_offset: 0
    bit_size: 7
fieldset/UEP_MAX_LEN:
  description: endpoint n max length packet register.
  fields:
  - name: UEP_MAX_LEN
    description: endpoint n max acceptable offset length.
    bit_offset: 0
    bit_size: 7
fieldset/UEP_RX_CTRL:
  description: endpoint n receive control.
  bit_size: 8
  fields:
  - name: RES_MASK
    description: endpoint n has control over the received response.
    bit_offset: 0
    bit_size: 2
  - name: UEP_TOG_MASK
    description: the reception of endpoint n expects a synchronous trigger. bit.
    bit_offset: 2
    bit_size: 2
  - name: ENDP_R_TOG_MATCH
    description: received synchronization trigger bit matches the desired. synchronization trigger bit state.
    bit_offset: 4
    bit_size: 1
  - name: UEP_R_NAK_TOG
    description: endpoint n for the received return NAK,packet type.
    bit_offset: 5
    bit_size: 1
  - name: UEP_R_NAK_ACT
    description: endpoint n receives the end of NAK flag.
    bit_offset: 6
    bit_size: 1
  - name: ENDP_R_DONE
    description: endpoint n receives the end flag.
    bit_offset: 7
    bit_size: 1
fieldset/UEP_RX_DMA:
  description: endpoint n receives the start address register of the buffer.
  fields:
  - name: UEP_RX_DMA
    description: endpoint receives the start address register of the buffer.
    bit_offset: 0
    bit_size: 17
fieldset/UEP_RX_LEN:
  description: endpoint n receives the lenth register in a single pass.
  bit_size: 16
  fields:
  - name: UEP_RX_LEN
    description: the length of data received by endpoint n in a single pass.
    bit_offset: 0
    bit_size: 16
fieldset/UEP_R_SIZE:
  description: the length register of the total received data at endpoint n.
  bit_size: 16
  fields:
  - name: UEP_R_SIZE
    description: the length of the total received data at endpoint n.
    bit_offset: 0
    bit_size: 16
fieldset/UEP_TX_CTRL:
  description: endpoint n send control register.
  bit_size: 8
  fields:
  - name: RES_MASK
    description: endpoint n control of the send response to IN transactions.
    bit_offset: 0
    bit_size: 2
  - name: UEP_TOG_MASK
    description: endpoint n synchronous trigger bit for the sender to. prepare.
    bit_offset: 2
    bit_size: 2
  - name: UEP_T_NAK_ACT
    description: endpoint n sends the end flag.
    bit_offset: 6
    bit_size: 1
  - name: ENDP_T_DONE
    description: endpoint n sends the end of NAK flag.
    bit_offset: 7
    bit_size: 1
fieldset/UEP_TX_DMA:
  description: endpoint n sends the start address register of the buffer.
  fields:
  - name: UEP_TX_DMA
    description: endpoint sends the start address register of the buffer.
    bit_offset: 0
    bit_size: 17
fieldset/UEP_T_LEN:
  description: endpoint n send the length register.
  bit_size: 16
  fields:
  - name: UEP_T_LEN
    description: endpoint n send the length.
    bit_offset: 0
    bit_size: 16
fieldset/UEP_AF_MODE:
  description: USB endpoint muitiplexing register.
  fields:
  - name: EP_T_AF
    description: 1 to 7 endpoint muitiplexing enables.
    bit_offset: 1
    bit_size: 7
fieldset/UEP_RX_EN:
  description: USB endpoint receive the enable registers.
  bit_size: 16
  fields:
  - name: UEP_RX_EN
    description: Endpoint 0 to 15 receive enable.
    bit_offset: 0
    bit_size: 16
fieldset/UEP_R_BURST:
  description: USB endpoint receives the burst register.
  bit_size: 8
  fields:
  - name: UEP_R_BURST_EN
    description: 0 to 7 endpoint receive burst enable.
    bit_offset: 0
    bit_size: 8
fieldset/UEP_R_ISO:
  description: usb endpoint receives a synchronous mode enable register.
  bit_size: 16
  fields:
  - name: UEP_R_ISO
    description: down endpoint(OUT) synchronization mode enabled.
    bit_offset: 1
    bit_size: 7
fieldset/UEP_R_RES_MODE:
  description: USB endpoint reply mode register.
  bit_size: 8
  fields:
  - name: UEP_R_RES_MODE
    description: 0 to 7 endpoint reply mode.
    bit_offset: 0
    bit_size: 8
fieldset/UEP_R_TOG_AUTO:
  description: USB endpoint receive the auto-filp enable register.
  bit_size: 16
  fields:
  - name: UEP_R_TOG_AUTO
    description: 0 to 7 endpoint synchronization triggers bit auto-filp. enable.
    bit_offset: 0
    bit_size: 8
fieldset/UEP_TX_EN:
  description: USB endpoint sends the enable register.
  bit_size: 16
  fields:
  - name: UEP_TX_EN
    description: Endpoint 0 to 15 sends enable.
    bit_offset: 0
    bit_size: 16
fieldset/UEP_T_BURST:
  description: USB endpoint sends a burst register.
  bit_size: 8
  fields:
  - name: UEP_T_BURST_EN
    description: 0 to 7 endpoint send burst enable.
    bit_offset: 0
    bit_size: 8
fieldset/UEP_T_BURST_MODE:
  description: USB endpoint send the mode register.
  bit_size: 8
  fields:
  - name: UEP_T_BURST_EN
    description: 0 to 7 endpoint send the mode enable.
    bit_offset: 0
    bit_size: 8
fieldset/UEP_T_ISO:
  description: usb endpoint sends a synchronous mode enable register.
  bit_size: 16
  fields:
  - name: UEP_T_ISO
    description: upload endpoint(IN) synchronization mode enabled.
    bit_offset: 1
    bit_size: 7
fieldset/UEP_T_TOG_AUTO:
  description: USB endpoint sends the auto-filp enable register.
  bit_size: 16
  fields:
  - name: UEP_T_TOG_AUTO
    description: 0 to 7 endpoint synchronization triggers bit auto-filp. enable.
    bit_offset: 0
    bit_size: 8
