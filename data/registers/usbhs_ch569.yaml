  bit_size: 8
  fields:
  - name: USB_IE_BUSRST_RB_USB_IE_DETECT
    description: enable interrupt for USB bus reset event for USB device mode _ enable interrupt for USB device detected event for USB host mode.
    bit_offset: 0
    bit_size: 1
  - name: USB_IE_TRANS
    description: enable interrupt for USB transfer completion.
    bit_offset: 1
    bit_size: 1
  - name: USB_IE_SUSPEND
    description: enable interrupt for USB suspend or resume event.
    bit_offset: 2
    bit_size: 1
  - name: USB_IE_SOF
    description: enable interrupt for host SOF timer action for USB host mode.
    bit_offset: 3
    bit_size: 1
  - name: USB_IE_FIFOOV
    description: enable interrupt for FIFO overflow.
    bit_offset: 4
    bit_size: 1
  - name: USB_IE_SETUPACT
    description: Setup packet end interrupt.
    bit_offset: 5
    bit_size: 1
  - name: USB_IE_ISOACT
    description: Synchronous transmission received control token packet interrupt.
    bit_offset: 6
    bit_size: 1
  - name: USB_IE_DEV_NAK
    description: enable interrupt for NAK responded for USB device mode.
    bit_offset: 7
    bit_size: 1
fieldset/USB_INT_FG:
  description: USB interrupt flag.
  bit_size: 8
  fields:
  - name: USB_IF_BUSRST_RB_USB_IF_DETECT
    description: bus reset event interrupt flag for USB device mode, direct bit address clear or write 1 to clear;device detected event interrupt flag for USB host mode, direct bit address clear or write 1 to clear.
    bit_offset: 0
    bit_size: 1
  - name: USB_IF_TRANSFER
    description: USB transfer completion interrupt flag, direct bit address clear or write 1 to clear.
    bit_offset: 1
    bit_size: 1
  - name: USB_IF_SUSPEND
    description: USB suspend or resume event interrupt flag, direct bit address clear or write 1 to clear.
    bit_offset: 2
    bit_size: 1
  - name: USB_IF_HST_SOF
    description: host SOF timer interrupt flag for USB host, direct bit address clear or write 1 to clear.
    bit_offset: 3
    bit_size: 1
  - name: USB_IF_FIFOOV
    description: FIFO overflow interrupt flag for USB, direct bit address clear or write 1 to clear.
    bit_offset: 4
    bit_size: 1
  - name: USB_IF_SETUOACT
    description: RO, Setup transaction end interrupt flag.
    bit_offset: 5
    bit_size: 1
  - name: USB_IF_ISOACT
    description: RO, Synchronous transmission received control token packet interrupt flag.
    bit_offset: 6
    bit_size: 1
fieldset/USB_INT_ST:
  description: USB interrupt status.
  bit_size: 8
  fields:
  - name: HOST_RES_MASK_RB_DEV_ENDP_MASK
    description: 'RO, bit mask of current transfer handshake response for USB host mode: 0000=no response, time out from device, others=handshake response PID received;RO, bit mask of current transfer endpoint number for USB device mode.'
    bit_offset: 0
    bit_size: 4
  - name: DEV_TOKEN_MASK
    description: RO, bit mask of current token PID code received for USB device mode.
    bit_offset: 4
    bit_size: 2
  - name: USB_ST_TOGOK
    description: RO, indicate current USB transfer toggle is OK.
    bit_offset: 6
    bit_size: 1
  - name: USB_ST_NAK
    description: RO, indicate current USB transfer is NAK received for USB device mode.
    bit_offset: 7
    bit_size: 1
