# CH572/CH570 Systick: one 32-bit counter with an up/down mode and automatic
# reload. The datasheet lists only CNTL at 0x08 and CMPLR at 0x10; the
# vendor core header also names the same words CNT and CMP, so both spellings
# point at one address. The SVD's CMPHR at 0x14 is not in the datasheet and
# its field is a copy of the low compare word, so it is not modelled.
block/Systick:
  description: Systick register, 32-bit up/down counter.
  items:
  - name: CTLR
    description: Systick counter control register.
    byte_offset: 0
    fieldset: CTLR
  - name: SR
    description: Systick count status register.
    byte_offset: 4
    fieldset: SR
  - name: CNT
    description: RW, System counter value, 32-bit view at the CNTL address.
    byte_offset: 8
    bit_size: 32
  - name: CNTL
    description: Systick counter low register.
    byte_offset: 8
    fieldset: CNTL
  - name: CMP
    description: RW, System compare value, 32-bit view at the CMPLR address.
    byte_offset: 16
    bit_size: 32
  - name: CMPLR
    description: Systick compare low register.
    byte_offset: 16
    fieldset: CMPLR
fieldset/CMPLR:
  description: Systick compare low register.
  fields:
  - name: CMPL
    description: RW, set the lower 32 bits of the reload counter value.
    bit_offset: 0
    bit_size: 32
fieldset/CNTL:
  description: Systick counter low register.
  fields:
  - name: CNTL
    description: RW, CNTL.
    bit_offset: 0
    bit_size: 32
fieldset/CTLR:
  description: Systick counter control register.
  fields:
  - name: STE
    description: Systick counter enable.
    bit_offset: 0
    bit_size: 1
  - name: STIE
    description: Systick counter interrupt enable.
    bit_offset: 1
    bit_size: 1
  - name: STCLK
    description: System counter clock Source selection.
    bit_offset: 2
    bit_size: 1
  - name: STRE
    description: System counter reload control.
    bit_offset: 3
    bit_size: 1
  - name: MODE
    description: counter mode.
    bit_offset: 4
    bit_size: 1
  - name: SWIE
    description: RW0,System soft interrupt enable.
    bit_offset: 31
    bit_size: 1
fieldset/SR:
  description: Systick count status register.
  fields:
  - name: CNTIF
    description: RW, CNTIF.
    bit_offset: 0
    bit_size: 1
  - name: SWIE
    description: RW, Enable software interrupt triggering.
    bit_offset: 31
    bit_size: 1
