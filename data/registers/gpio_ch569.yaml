    bit_offset: 0
    bit_size: 1
  - name: PA3_IF
    description: PA3 pin interrupt flag.
    bit_offset: 1
    bit_size: 1
  - name: PA4_IF
    description: PA4 pin interrupt flag.
    bit_offset: 2
    bit_size: 1
  - name: PB3_IF
    description: PB3 pin interrupt flag.
    bit_offset: 3
    bit_size: 1
  - name: PB4_IF
    description: PB4 pin interrupt flag.
    bit_offset: 4
    bit_size: 1
  - name: PB11_IF
    description: PB11 pin interrupt flag.
    bit_offset: 5
    bit_size: 1
  - name: PB12_IF
    description: PB12 pin interrupt flag.
    bit_offset: 6
    bit_size: 1
  - name: PB15_IF
    description: PB15 pin interrupt flag.
    bit_offset: 7
    bit_size: 1
fieldset/INT_MODE:
  description: 'GPIO interrupt trigger mode: 1=edge, 0=level.'
  bit_size: 8
  fields:
  - name: PA2_IM
    description: PA2 pin interrupt mode.
    bit_offset: 0
    bit_size: 1
  - name: PA3_IM
    description: PA3 pin interrupt mode.
    bit_offset: 1
    bit_size: 1
  - name: PA4_IM
    description: PA4 pin interrupt mode.
    bit_offset: 2
    bit_size: 1
  - name: PB3_IM
