# GPIO on CH565/CH569. The DS implements PA[23:0] and PB[24:0]; ports are
# modelled as 32-bit arrays, with bonded pins left to the pin map.
block/GPIO:
  description: GPIO register.
  items:
  - name: INT_FLAG
    description: GPIO interrupt flag; write 1 to clear.
    byte_offset: 28
    bit_size: 8
    fieldset: INT_FLAG
  - name: INT_ENABLE
    description: GPIO interrupt enable.
    byte_offset: 29
    bit_size: 8
    fieldset: INT_ENABLE
  - name: INT_MODE
    description: GPIO interrupt mode.
    byte_offset: 30
    bit_size: 8
    fieldset: INT_MODE
  - name: INT_POLAR
    description: GPIO interrupt polarity.
    byte_offset: 31
    bit_size: 8
    fieldset: INT_POLAR
  - name: PA_DIR
    description: GPIO PA I/O direction.
    byte_offset: 64
    fieldset: PA_DIR
  - name: PA_PIN
    description: GPIO PA input.
    byte_offset: 68
    access: Read
    fieldset: PA_PIN
  - name: PA_OUT
    description: GPIO PA output.
    byte_offset: 72
    fieldset: PA_OUT
  - name: PA_CLR
    description: GPIO PA clear output.
    byte_offset: 76
    access: Write
    fieldset: PA_CLR
  - name: PA_PU
    description: GPIO PA pullup resistance enable.
    byte_offset: 80
    fieldset: PA_PU
  - name: PA_PD
    description: GPIO PA output open-drain and input pulldown resistance enable.
    byte_offset: 84
    fieldset: PA_PD
  - name: PA_DRV
    description: GPIO PA driving capability.
    byte_offset: 88
    fieldset: PA_DRV
  - name: PA_SMT
    description: GPIO PA output slew rate and input schmitt trigger.
    byte_offset: 92
    fieldset: PA_SMT
  - name: PB_DIR
    description: GPIO PB I/O direction.
    byte_offset: 96
    fieldset: PB_DIR
  - name: PB_PIN
    description: GPIO PB input.
    byte_offset: 100
    access: Read
    fieldset: PB_PIN
  - name: PB_OUT
    description: GPIO PB output.
    byte_offset: 104
    fieldset: PB_OUT
  - name: PB_CLR
    description: GPIO PB clear output.
    byte_offset: 108
    access: Write
    fieldset: PB_CLR
  - name: PB_PU
    description: GPIO PB pullup resistance enable.
    byte_offset: 112
    fieldset: PB_PU
  - name: PB_PD
    description: GPIO PB output open-drain and input pulldown resistance enable.
    byte_offset: 116
    fieldset: PB_PD
  - name: PB_DRV
    description: GPIO PB driving capability.
    byte_offset: 120
    fieldset: PB_DRV
  - name: PB_SMT
    description: GPIO PB output slew rate and input schmitt trigger.
    byte_offset: 124
    fieldset: PB_SMT
fieldset/PA_CLR:
  description: GPIO PA clear output.
  fields:
  - name: PA_CLR
    description: 'GPIO PA clear output: write 1 to drive the pin output low, write 0 leaves it unchanged.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_DIR:
  description: GPIO PA I/O direction.
  fields:
  - name: PA_DIR
    description: 'GPIO PA I/O direction: 0=input, 1=output.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_DRV:
  description: GPIO PA driving capability.
  fields:
  - name: PA_DRV
    description: 'GPIO PA output drive current: 1=max 16mA, 0=max 8mA.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_OUT:
  description: GPIO PA output.
  fields:
  - name: PA_OUT
    description: 'GPIO PA output level: 1=high, 0=low.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_PD:
  description: GPIO PA output open-drain and input pulldown resistance enable.
  fields:
  - name: PA_PD
    description: 'GPIO PA open-drain output (output mode) / pull-down resistor (input mode): 1=enabled, 0=disabled.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_PIN:
  description: GPIO PA input.
  fields:
  - name: PA_PIN
    description: 'GPIO PA input level: 1=high, 0=low.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_PU:
  description: GPIO PA pullup resistance enable.
  fields:
  - name: PA_PU
    description: 'GPIO PA pull-up resistor: 1=enabled, 0=disabled.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PA_SMT:
  description: GPIO PA output slew rate and input schmitt trigger.
  fields:
  - name: PA_SMT
    description: 'GPIO PA low-slew-rate output (output mode) / Schmitt-trigger input (input mode): 1=enabled, 0=disabled.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PB_CLR:
  description: GPIO PB clear output.
  fields:
  - name: PB_CLR
    description: 'GPIO PB clear output: write 1 to drive the pin output low, write 0 leaves it unchanged.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PB_DIR:
  description: GPIO PB I/O direction.
  fields:
  - name: PB_DIR
