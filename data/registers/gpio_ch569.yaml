    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PB_DRV:
  description: GPIO PB driving capability.
  fields:
  - name: PB_DRV
    description: 'GPIO PB output drive current: 1=max 16mA, 0=max 8mA.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PB_OUT:
  description: GPIO PB output.
  fields:
  - name: PB_OUT
    description: 'GPIO PB output level: 1=high, 0=low.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PB_PD:
  description: GPIO PB output open-drain and input pulldown resistance enable.
  fields:
  - name: PB_PD
    description: 'GPIO PB open-drain output (output mode) / pull-down resistor (input mode): 1=enabled, 0=disabled.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PB_PIN:
  description: GPIO PB input.
  fields:
  - name: PB_PIN
    description: 'GPIO PB input level: 1=high, 0=low.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PB_PU:
  description: GPIO PB pullup resistance enable.
  fields:
  - name: PB_PU
    description: 'GPIO PB pull-up resistor: 1=enabled, 0=disabled.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/PB_SMT:
  description: GPIO PB output slew rate and input schmitt trigger.
  fields:
  - name: PB_SMT
    description: 'GPIO PB low-slew-rate output (output mode) / Schmitt-trigger input (input mode): 1=enabled, 0=disabled.'
    bit_offset: 0
    bit_size: 1
    array:
      len: 32
      stride: 1
fieldset/INT_ENABLE:
  description: GPIO interrupt enable.
  bit_size: 8
  fields:
  - name: PA2_IE
    description: PA2 pin interrupt enable.
    bit_offset: 0
    bit_size: 1
  - name: PA3_IE
    description: PA3 pin interrupt enable.
    bit_offset: 1
    bit_size: 1
  - name: PA4_IE
    description: PA4 pin interrupt enable.
    bit_offset: 2
    bit_size: 1
  - name: PB3_IE
    description: PB3 pin interrupt enable.
    bit_offset: 3
    bit_size: 1
  - name: PB4_IE
    description: PB4 pin interrupt enable.
    bit_offset: 4
    bit_size: 1
  - name: PB11_IE
    description: PB11 pin interrupt enable.
    bit_offset: 5
    bit_size: 1
  - name: PB12_IE
