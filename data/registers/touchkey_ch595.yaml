block/TouchKey:
  description: Touch buttons.
  items:
  - name: CFG
    description: RW, Touchkey configure.
    byte_offset: 87
    bit_size: 8
    fieldset: CFG
  - name: CFG2
    description: RW, TouchKey configuration register 2.
    byte_offset: 120
    fieldset: CFG2
  - name: SEL
    description: RW, TouchKey selection register.
    byte_offset: 124
    fieldset: SEL
fieldset/CFG2:
  description: RW, TouchKey configuration register 2.
  fields:
  - name: TRANS
    description: RW, Touch key Capacitive charge moving time.
    bit_offset: 0
    bit_size: 3
  - name: CC
    description: RW, Touch key capacitor charging time.
    bit_offset: 3
    bit_size: 2
  - name: TKADC_START_SEL
    description: 'RW, Touch the key to start ADC time selection in advance, unit: moving cycle.'
    bit_offset: 5
    bit_size: 2
  - name: EN
    description: RW, TKEY module enable.
    bit_offset: 7
    bit_size: 1
  - name: CTRANS_ACT
    description: RW, TKEY module start signal and working status, automatic reset.
    bit_offset: 8
    bit_size: 1
  - name: TRANSFER_N
    description: RW, Number of moving cycles.
    bit_offset: 16
    bit_size: 10
fieldset/SEL:
  description: RW, TouchKey selection register.
  fields:
  - name: SEL_CS
    description: RW, Selection of charge transfer channel.
    bit_offset: 0
    bit_size: 14
  - name: DRIVEROUT_EN
    description: RW, TouchKey drive shield channel selection switch.
    bit_offset: 16
    bit_size: 14
fieldset/CFG:
  description: RW, Touchkey configure.
  bit_size: 8
  fields:
  - name: DRV_EN
    description: RW, Touchkey drive shield enable.
    bit_offset: 2
    bit_size: 1
  - name: ADC_PGA_CFG
    description: RW, Select the running speed of PGA in ADC.
    bit_offset: 3
    bit_size: 1
  - name: DMA_EN
    description: RW, TouchKey DMA Enable.
    bit_offset: 6
    bit_size: 1
