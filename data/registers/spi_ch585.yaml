# SPI on CH585. block/SPI_FULL is Master/Slave + DMA (SPI0);
# block/SPI_NODMA is Master-only without DMA (SPI1). Kind is spi;
# instance number is only in the family list.

block/SPI_FULL:
  description: SPI register.
  items:
  - name: CTRL_MOD
    description: RW, SPI mode control.
    byte_offset: 0
    bit_size: 8
    fieldset: CTRL_MOD
  - name: CTRL_CFG
    description: RW, SPI configuration control.
    byte_offset: 1
    bit_size: 8
    fieldset: CTRL_CFG
  - name: INTER_EN
    description: RW, SPI interrupt enable.
    byte_offset: 2
    bit_size: 8
    fieldset: INTER_EN
  - name: CLOCK_DIV
    description: RW, SPI master clock divisor.
    byte_offset: 3
    bit_size: 8
    fieldset: CLOCK_DIV
  - name: SLAVE_PRE
    description: RW, SPI slave preset value.
    byte_offset: 3
    bit_size: 8
    fieldset: SLAVE_PRE
  - name: BUFFER
    description: RW, SPI data buffer.
    byte_offset: 4
    bit_size: 8
    fieldset: BUFFER
  - name: RUN_FLAG
    description: RO, SPI work flag.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: RUN_FLAG
  - name: INT_FLAG
    description: RW1, SPI interrupt flag.
    byte_offset: 6
    bit_size: 8
    fieldset: INT_FLAG
  - name: FIFO_COUNT
    description: RW, SPI FIFO count status.
    byte_offset: 7
    bit_size: 8
    fieldset: FIFO_COUNT
  - name: TOTAL_CNT
    description: RW, SPI total byte count, only low 12 bit.
    byte_offset: 12
    bit_size: 16
    fieldset: TOTAL_CNT
  - name: FIFO
    description: RO/WO, SPI FIFO register.
    byte_offset: 16
    bit_size: 8
    fieldset: FIFO
  - name: FIFO_COUNT1
    description: RO, SPI FIFO count status.
    byte_offset: 19
    access: Read
    bit_size: 8
    fieldset: FIFO_COUNT1
  - name: DMA_NOW
    description: RW, SPI DMA current address.
    byte_offset: 20
    fieldset: DMA_NOW
  - name: DMA_BEG
    description: RW, SPI DMA begin address.
    byte_offset: 24
    fieldset: DMA_BEG
  - name: DMA_END
    description: RW, SPI DMA end address.
    byte_offset: 28
    fieldset: DMA_END

block/SPI_NODMA:
  description: SPI register.
  items:
  - name: CTRL_MOD
    description: RW, SPI mode control.
    byte_offset: 0
    bit_size: 8
    fieldset: CTRL_MOD
  - name: CTRL_CFG
    description: RW, SPI configuration control.
    byte_offset: 1
    bit_size: 8
    fieldset: CTRL_CFG
  - name: INTER_EN
    description: RW, SPI interrupt enable.
    byte_offset: 2
    bit_size: 8
    fieldset: INTER_EN
  - name: CLOCK_DIV
    description: RW, SPI master clock divisor;RW, SPI slave preset value.
    byte_offset: 3
    bit_size: 8
    fieldset: CLOCK_DIV
  - name: BUFFER
    description: RW, SPI data buffer.
    byte_offset: 4
    bit_size: 8
    fieldset: BUFFER
  - name: RUN_FLAG
    description: RO, SPI work flag.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: RUN_FLAG
  - name: INT_FLAG
    description: RW1, SPI interrupt flag.
    byte_offset: 6
    bit_size: 8
    fieldset: INT_FLAG
  - name: FIFO_COUNT
    description: RW, SPI FIFO count status.
    byte_offset: 7
    bit_size: 8
    fieldset: FIFO_COUNT
  - name: TOTAL_CNT
    description: RW, SPI total byte count, only low 12 bit.
    byte_offset: 12
    bit_size: 16
    fieldset: TOTAL_CNT
  - name: FIFO
    description: RO/WO, SPI FIFO register.
    byte_offset: 16
    bit_size: 8
    fieldset: FIFO
  - name: FIFO_COUNT1
    description: RO, SPI FIFO count status.
    byte_offset: 19
    access: Read
    bit_size: 8
    fieldset: FIFO_COUNT1

fieldset/TOTAL_CNT:
  description: RW, SPI total byte count, only low 12 bit.
  bit_size: 16
  fields:
  - name: TOTAL_CNT
    description: RW, SPI total byte count, only low 12 bit.
    bit_offset: 0
    bit_size: 12

fieldset/DMA_BEG:
  description: RW, SPI DMA begin address.
  fields:
  - name: DMA_BEG
    description: RW, SPI DMA begin address.
    bit_offset: 0
    bit_size: 17

fieldset/DMA_END:
  description: RW, SPI DMA end address.
  fields:
  - name: DMA_END
    description: RW, SPI DMA end address.
    bit_offset: 0
    bit_size: 17

fieldset/DMA_NOW:
  description: RW, SPI DMA current address.
  fields:
  - name: DMA_NOW
    description: RW, SPI DMA current address.
    bit_offset: 0
    bit_size: 17

fieldset/BUFFER:
  description: RW, SPI data buffer.
  bit_size: 8
  fields:
  - name: BUFFER
    description: RW, SPI data buffer.
    bit_offset: 0
    bit_size: 8

fieldset/CLOCK_DIV:
  description: RW, SPI master clock divisor.
  bit_size: 8
  fields:
  - name: CLOCK_DIV
    description: RW, SPI master clock divisor.
    bit_offset: 0
    bit_size: 8
fieldset/SLAVE_PRE:
  description: RW, SPI slave preset value.
  bit_size: 8
  fields:
  - name: SLAVE_PRE
    description: RW, SPI slave preset value.
    bit_offset: 0
    bit_size: 8

fieldset/CTRL_CFG:
  description: RW, SPI configuration control.
  bit_size: 8
  fields:
  - name: DMA_ENABLE
    description: RW, SPI DMA enable.
    bit_offset: 0
    bit_size: 1
  - name: DMA_LOOP
    description: RW, SPI DMA address loop enable.
    bit_offset: 2
    bit_size: 1
  - name: AUTO_IF
    description: RW, enable buffer/FIFO accessing to auto clear RB_SPI_IF_BYTE_END interrupt flag.
    bit_offset: 4
    bit_size: 1
  - name: BIT_ORDER
    description: 'RW, SPI bit data order: 0=MSB first, 1=LSB first.'
    bit_offset: 5
    bit_size: 1
  - name: MST_DLY_EN
    description: RW, SPI master input delay enable.
    bit_offset: 6
    bit_size: 1

fieldset/CTRL_MOD:
  description: RW, SPI mode control.
  bit_size: 8
  fields:
  - name: MODE_SLAVE
    description: 'RW, SPI slave mode: 0=master or host, 1=slave or device.'
    bit_offset: 0
    bit_size: 1
  - name: ALL_CLEAR
    description: RW, force clear SPI FIFO and count.
    bit_offset: 1
    bit_size: 1
  - name: 2WIRE_MOD
    description: 'RW, SPI enable 2 wire mode for slave: 0=3wire(SCK0,MOSI,MISO), 1=2wire(SCK0,MISO=MXSX).'
    bit_offset: 2
    bit_size: 1
  - name: MST_SCK_MOD
    description: 'RW, SPI master clock mode: 0=mode 0, 1=mode 3.'
    bit_offset: 3
    bit_size: 1
  - name: SLV_CMD_MOD
    description: 'RW, SPI slave command mode: 0=byte stream, 1=first byte command.'
    bit_offset: 3
    bit_size: 1
  - name: FIFO_DIR
    description: 'RW, SPI FIFO direction: 0=out(write @master mode), 1=in(read @master mode).'
    bit_offset: 4
    bit_size: 1
  - name: SCK_OE
    description: RW, SPI SCK output enable.
    bit_offset: 5
    bit_size: 1
  - name: MOSI_OE
    description: RW, SPI MOSI output enable.
    bit_offset: 6
    bit_size: 1
  - name: MISO_OE
    description: RW, SPI MISO output enable.
    bit_offset: 7
    bit_size: 1

fieldset/FIFO:
  description: RO/WO, SPI FIFO register.
  bit_size: 8
  fields:
  - name: FIFO
    description: RO/WO, SPI FIFO register.
    bit_offset: 0
    bit_size: 8

fieldset/FIFO_COUNT:
  description: RW, SPI FIFO count status.
  bit_size: 8
  fields:
  - name: FIFO_COUNT
    description: RW, SPI FIFO count status.
    bit_offset: 0
    bit_size: 4

fieldset/FIFO_COUNT1:
  description: RO, SPI FIFO count status.
  bit_size: 8
  fields:
  - name: FIFO_COUNT1
    description: RO, SPI FIFO count status.
    bit_offset: 0
    bit_size: 8

fieldset/INTER_EN:
  description: RW, SPI interrupt enable.
  bit_size: 8
  fields:
  - name: IE_CNT_END
    description: RW, enable interrupt for SPI total byte count end.
    bit_offset: 0
    bit_size: 1
  - name: IE_BYTE_END
    description: RW, enable interrupt for SPI byte exchanged.
    bit_offset: 1
    bit_size: 1
  - name: IE_FIFO_HF
    description: RW, enable interrupt for SPI FIFO half.
    bit_offset: 2
    bit_size: 1
  - name: IE_DMA_END
    description: RW, enable interrupt for SPI DMA completion.
    bit_offset: 3
    bit_size: 1
  - name: IE_FIFO_OV
    description: RW, enable interrupt for SPI FIFO overflow.
    bit_offset: 4
    bit_size: 1
  - name: IE_FST_BYTE
    description: RW, enable interrupt for SPI slave mode first byte received.
    bit_offset: 7
    bit_size: 1

fieldset/INT_FLAG:
  description: RW1, SPI interrupt flag.
  bit_size: 8
  fields:
  - name: IF_CNT_END
    description: RW1, interrupt flag for SPI total byte count end.
    bit_offset: 0
    bit_size: 1
  - name: IF_BYTE_END
    description: RW1, interrupt flag for SPI byte exchanged.
    bit_offset: 1
    bit_size: 1
  - name: IF_FIFO_HF
    description: RW1, interrupt flag for SPI FIFO half.
    bit_offset: 2
    bit_size: 1
  - name: IF_DMA_END
    description: RW1, interrupt flag for SPI DMA completion.
    bit_offset: 3
    bit_size: 1
  - name: IF_FIFO_OV
    description: RW1, interrupt flag for SPI FIFO overflow.
    bit_offset: 4
    bit_size: 1
  - name: FREE
    description: RO, current SPI free status.
    bit_offset: 6
    bit_size: 1
  - name: IF_FST_BYTE
    description: RW1, interrupt flag for SPI slave mode first byte received.
    bit_offset: 7
    bit_size: 1

fieldset/RUN_FLAG:
  description: RO, SPI work flag.
  bit_size: 8
  fields:
  - name: SLV_CMD_ACT
    description: RO, SPI slave first byte or command flag.
    bit_offset: 4
    bit_size: 1
  - name: FIFO_READY
    description: RO, SPI FIFO ready status.
    bit_offset: 5
    bit_size: 1
  - name: SLV_CS_LOAD
    description: RO, SPI slave chip-select loading status.
    bit_offset: 6
    bit_size: 1
  - name: SLV_SELECT
    description: RO, SPI slave selection status.
    bit_offset: 7
    bit_size: 1

