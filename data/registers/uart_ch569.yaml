# UART on CH569. block/UART_FULL includes MSR/modem (UART0);
# block/UART_NOMODEM is UART1-3.

block/UART_FULL:
  description: UART_FULL register.
  items:
  - name: MCR
    description: UART_FULL modem control.
    byte_offset: 0
    bit_size: 8
    fieldset: MCR_FULL
  - name: IER
    description: UART_FULL interrupt enable.
    byte_offset: 1
    bit_size: 8
    fieldset: IER_FULL
  - name: FCR
    description: UART_FULL FIFO control.
    byte_offset: 2
    bit_size: 8
    fieldset: FCR
  - name: LCR
    description: UART_FULL line control.
    byte_offset: 3
    bit_size: 8
    fieldset: LCR
  - name: IIR
    description: UART_FULL interrupt identification.
    byte_offset: 4
    access: Read
    bit_size: 8
    fieldset: IIR
  - name: LSR
    description: UART_FULL line status.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: LSR
  - name: MSR
    description: UART_FULL modem status.
    byte_offset: 6
    access: Read
    bit_size: 8
    fieldset: MSR
  - name: RBR
    description: UART_FULL receiver buffer, receiving byte.
    byte_offset: 8
    access: Read
    bit_size: 8
    fieldset: RBR
  - name: THR
    description: UART_FULL transmitter holding, transmittal byte.
    byte_offset: 8
    access: Write
    bit_size: 8
    fieldset: THR
  - name: RFC
    description: UART_FULL receiver FIFO count.
    byte_offset: 10
    access: Read
    bit_size: 8
    fieldset: RFC
  - name: TFC
    description: UART_FULL transmitter FIFO count.
    byte_offset: 11
    access: Read
    bit_size: 8
    fieldset: TFC
  - name: DL
    description: UART_FULL divisor latch.
    byte_offset: 12
    bit_size: 16
    fieldset: DL
  - name: DIV
    description: UART_FULL pre-divisor latch byte.
    byte_offset: 14
    bit_size: 8
    fieldset: DIV_FULL
  - name: ADR
    description: UART_FULL slave address.
    byte_offset: 15
    bit_size: 8
    fieldset: ADR

block/UART_NOMODEM:
  description: UART_NOMODEM register.
  items:
  - name: MCR
    description: UART_NOMODEM modem control.
    byte_offset: 0
    bit_size: 8
    fieldset: MCR_NOMODEM
  - name: IER
    description: UART_NOMODEM interrupt enable.
    byte_offset: 1
    bit_size: 8
    fieldset: IER_NOMODEM
  - name: FCR
    description: UART_NOMODEM FIFO control.
    byte_offset: 2
    bit_size: 8
    fieldset: FCR
  - name: LCR
    description: UART_NOMODEM line control.
    byte_offset: 3
    bit_size: 8
    fieldset: LCR
  - name: IIR
    description: UART_NOMODEM interrupt identification.
    byte_offset: 4
    access: Read
    bit_size: 8
    fieldset: IIR
  - name: LSR
    description: UART_NOMODEM line status.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: LSR
  - name: RBR
    description: UART_NOMODEM receiver buffer, receiving byte.
    byte_offset: 8
    access: Read
    bit_size: 8
    fieldset: RBR
  - name: THR
    description: UART_NOMODEM transmitter holding, transmittal byte.
    byte_offset: 8
    access: Write
    bit_size: 8
    fieldset: THR
  - name: RFC
    description: UART_NOMODEM receiver FIFO count.
    byte_offset: 10
    access: Read
    bit_size: 8
    fieldset: RFC
  - name: TFC
    description: UART_NOMODEM transmitter FIFO count.
    byte_offset: 11
    access: Read
    bit_size: 8
    fieldset: TFC
  - name: DL
    description: UART_NOMODEM divisor latch.
    byte_offset: 12
    bit_size: 16
    fieldset: DL
  - name: DIV
    description: UART_NOMODEM pre-divisor latch byte.
    byte_offset: 14
    bit_size: 8
    fieldset: DIV_NOMODEM

fieldset/DL:
  description: UART_FULL divisor latch.
  bit_size: 16
  fields:
  - name: DL
    description: UART divisor latch.
    bit_offset: 0
    bit_size: 16

fieldset/ADR:
  description: UART_FULL slave address.
  bit_size: 8
  fields:
  - name: ADR
    description: UART_FULL slave address.
    bit_offset: 0
    bit_size: 8

fieldset/DIV_FULL:
  description: UART_FULL pre-divisor latch byte.
  bit_size: 8
  fields:
  - name: ADR
    description: UART pre-divisor latch byte.
    bit_offset: 0
    bit_size: 8

fieldset/FCR:
  description: UART_FULL FIFO control.
  bit_size: 8
  fields:
  - name: FCR_FIFO_EN
    description: UART FIFO enable.
    bit_offset: 0
    bit_size: 1
  - name: FCR_RX_FIFO_CLR
    description: clear UART receiver FIFO, high action, auto clear.
    bit_offset: 1
    bit_size: 1
  - name: FCR_TX_FIFO_CLR
    description: clear UART transmitter FIFO, high action, auto clear.
    bit_offset: 2
    bit_size: 1
  - name: FCR_FIFO_TRIG
    description: UART receiver FIFO trigger level.
    bit_offset: 6
    bit_size: 2

fieldset/IER_FULL:
  description: UART_FULL interrupt enable.
  bit_size: 8
  fields:
  - name: IER_RECV_RDY
    description: UART interrupt enable for receiver data ready.
    bit_offset: 0
    bit_size: 1
  - name: IER_THR_EMPTY
    description: UART interrupt enable for THR empty.
    bit_offset: 1
    bit_size: 1
  - name: IER_LINE_STAT
    description: UART interrupt enable for receiver line status.
    bit_offset: 2
    bit_size: 1
  - name: IER_MODEM_CHG
    description: UART_FULL interrupt enable for modem status change.
    bit_offset: 3
    bit_size: 1
  - name: IER_DTR_EN
    description: UART_FULL DTR/TNOW output pin enable.
    bit_offset: 4
    bit_size: 1
  - name: IER_RTS_EN
    description: UART_FULL RTS output pin enable.
    bit_offset: 5
    bit_size: 1
  - name: IER_TXD_EN
    description: UART TXD pin enable.
    bit_offset: 6
    bit_size: 1
  - name: IER_RESET
    description: UART software reset control, high action, auto clear.
    bit_offset: 7
    bit_size: 1

fieldset/IIR:
  description: UART_FULL interrupt identification.
  bit_size: 8
  fields:
  - name: IIR_NO_INT
    description: UART no interrupt flag.
    bit_offset: 0
    bit_size: 1
  - name: IIR_INT_MASK
    description: UART interrupt flag bit mask.
    bit_offset: 1
    bit_size: 3
  - name: IIR_FIFO_ID
    description: UART FIFO enabled flag.
    bit_offset: 6
    bit_size: 2

fieldset/LCR:
  description: UART_FULL line control.
  bit_size: 8
  fields:
  - name: LCR_WORD_SZ
    description: UART word bit length.
    bit_offset: 0
    bit_size: 2
  - name: LCR_STOP_BIT
    description: UART stop bit length.
    bit_offset: 2
    bit_size: 1
  - name: LCR_PAR_EN
    description: UART parity enable.
    bit_offset: 3
    bit_size: 1
  - name: LCR_PAR_MOD
    description: UART parity mode.
    bit_offset: 4
    bit_size: 2
  - name: LCR_BREAK_EN
    description: UART break control enable.
    bit_offset: 6
    bit_size: 1
  - name: LCR_DLAB_RB_LCR_GP_BIT
    description: UART reserved bit _UART general purpose bit.
    bit_offset: 7
    bit_size: 1

fieldset/LSR:
  description: UART_FULL line status.
  bit_size: 8
  fields:
  - name: LSR_DATA_RDY
    description: UART receiver fifo data ready status.
    bit_offset: 0
    bit_size: 1
  - name: LSR_OVER_ERR
    description: UART receiver overrun error.
    bit_offset: 1
    bit_size: 1
  - name: LSR_PAR_ERR
    description: UART receiver frame error.
    bit_offset: 2
    bit_size: 1
  - name: LSR_FRAME_ERR
    description: UART receiver frame error.
    bit_offset: 3
    bit_size: 1
  - name: LSR_BREAK_ERR
    description: UART receiver break error.
    bit_offset: 4
    bit_size: 1
  - name: LSR_TX_FIFO_EMP
    description: UART transmitter fifo empty status.
    bit_offset: 5
    bit_size: 1
  - name: LSR_TX_ALL_EMP
    description: UART transmitter all empty status.
    bit_offset: 6
    bit_size: 1
  - name: LSR_ERR_RX_FIFO
    description: indicate error in UART receiver fifo.
    bit_offset: 7
    bit_size: 1

fieldset/MCR_FULL:
  description: UART_FULL modem control.
  bit_size: 8
  fields:
  - name: MCR_DTR
    description: UART_FULL control DTR.
    bit_offset: 0
    bit_size: 1
  - name: MCR_RTS
    description: UART_FULL control RTS.
    bit_offset: 1
    bit_size: 1
  - name: MCR_OUT1
    description: UART_FULL control OUT1.
    bit_offset: 2
    bit_size: 1
  - name: MCR_OUT2
    description: UART control OUT2.
    bit_offset: 3
    bit_size: 1
  - name: MCR_LOOP
    description: UART_FULL enable local loop back.
    bit_offset: 4
    bit_size: 1
  - name: MCR_AU_FLOW_EN
    description: UART_FULL enable autoflow control.
    bit_offset: 5
    bit_size: 1
  - name: MCR_TNOW
    description: UART_FULL enable TNOW output on DTR pin.
    bit_offset: 6
    bit_size: 1
  - name: MCR_HALF
    description: UART_FULL enable half-duplex.
    bit_offset: 7
    bit_size: 1

fieldset/MSR:
  description: UART_FULL modem status.
  bit_size: 8
  fields:
  - name: MSR_CTS_CHG
    description: UART_FULL CTS changed status, high action.
    bit_offset: 0
    bit_size: 1
  - name: MSR_DSR_CHG
    description: UART_FULL DSR changed status, high action.
    bit_offset: 1
    bit_size: 1
  - name: MSR_RI_CHG
    description: UART_FULL RI changed status, high action.
    bit_offset: 2
    bit_size: 1
  - name: MSR_DCD_CHG
    description: UART_FULL DCD changed status, high action.
    bit_offset: 3
    bit_size: 1
  - name: MSR_CTS
    description: UART_FULL CTS action status.
    bit_offset: 4
    bit_size: 1
  - name: MSR_DSR
    description: UART_FULL DSR action status.
    bit_offset: 5
    bit_size: 1
  - name: MSR_RI
    description: UART_FULL RI action status.
    bit_offset: 6
    bit_size: 1
  - name: MSR_DCD
    description: UART_FULL DCD action status.
    bit_offset: 7
    bit_size: 1

fieldset/RBR:
  description: UART receiver buffer, receiving byte.
  bit_size: 8
  fields:
  - name: RBR
    description: UART receiver buffer, receiving byte.
    bit_offset: 0
    bit_size: 8
fieldset/THR:
  description: UART transmitter holding, transmittal byte.
  bit_size: 8
  fields:
  - name: THR
    description: UART transmitter holding, transmittal byte.
    bit_offset: 0
    bit_size: 8

fieldset/RFC:
  description: UART_FULL receiver FIFO count.
  bit_size: 8
  fields:
  - name: RFC
    description: UART receiver FIFO count.
    bit_offset: 0
    bit_size: 8

fieldset/TFC:
  description: UART_FULL transmitter FIFO count.
  bit_size: 8
  fields:
  - name: TFC
    description: UART transmitter FIFO count.
    bit_offset: 0
    bit_size: 8

fieldset/DIV_NOMODEM:
  description: UART_NOMODEM pre-divisor latch byte.
  bit_size: 8
  fields:
  - name: DIV
    description: UART pre-divisor latch byte.
    bit_offset: 0
    bit_size: 8

fieldset/IER_NOMODEM:
  description: UART_NOMODEM interrupt enable.
  bit_size: 8
  fields:
  - name: IER_RECV_RDY
    description: UART interrupt enable for receiver data ready.
    bit_offset: 0
    bit_size: 1
  - name: IER_THR_EMPTY
    description: UART interrupt enable for THR empty.
    bit_offset: 1
    bit_size: 1
  - name: IER_LINE_STAT
    description: UART interrupt enable for receiver line status.
    bit_offset: 2
    bit_size: 1
  - name: IER_TXD_EN
    description: UART TXD pin enable.
    bit_offset: 6
    bit_size: 1
  - name: IER_RESET
    description: UART software reset control, high action, auto clear.
    bit_offset: 7
    bit_size: 1

fieldset/MCR_NOMODEM:
  description: UART_NOMODEM modem control.
  bit_size: 8
  fields:
  - name: MCR_OUT2
    description: UART_NOMODEM control OUT2.
    bit_offset: 3
    bit_size: 1

