# UART on CH569. block/UART_FULL includes MSR/modem (UART0);
# block/UART_NOMODEM is UART1-3.

block/UART_FULL:
  description: UART_FULL register.
  items:
  - name: R8_UART_FULL_MCR
    description: UART_FULL modem control.
    byte_offset: 0
    bit_size: 8
    fieldset: R8_UART_FULL_MCR
  - name: R8_UART_FULL_IER
    description: UART_FULL interrupt enable.
    byte_offset: 1
    bit_size: 8
    fieldset: R8_UART_FULL_IER
  - name: R8_UART_FULL_FCR
    description: UART_FULL FIFO control.
    byte_offset: 2
    bit_size: 8
    fieldset: R8_UART_FULL_FCR
  - name: R8_UART_FULL_LCR
    description: UART_FULL line control.
    byte_offset: 3
    bit_size: 8
    fieldset: R8_UART_FULL_LCR
  - name: R8_UART_FULL_IIR
    description: UART_FULL interrupt identification.
    byte_offset: 4
    access: Read
    bit_size: 8
    fieldset: R8_UART_FULL_IIR
  - name: R8_UART_FULL_LSR
    description: UART_FULL line status.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: R8_UART_FULL_LSR
  - name: R8_UART_FULL_MSR
    description: UART_FULL modem status.
    byte_offset: 6
    access: Read
    bit_size: 8
    fieldset: R8_UART_FULL_MSR
  - name: R8_UART_FULL_RBR_R8_UART_FULL_THR
    description: UART_FULL receiver buffer, receiving byte _ UART_FULL transmitter holding, transmittal byte.
    byte_offset: 8
    bit_size: 8
    fieldset: R8_UART_FULL_RBR_R8_UART_FULL_THR
  - name: R8_UART_FULL_RFC
    description: UART_FULL receiver FIFO count.
    byte_offset: 10
    access: Read
    bit_size: 8
    fieldset: R8_UART_FULL_RFC
  - name: R8_UART_FULL_TFC
    description: UART_FULL transmitter FIFO count.
    byte_offset: 11
    access: Read
    bit_size: 8
    fieldset: R8_UART_FULL_TFC
  - name: R16_UART_FULL_DL
    description: UART_FULL divisor latch.
    byte_offset: 12
    bit_size: 16
    fieldset: R16_UART_FULL_DL
  - name: R8_UART_FULL_DIV
    description: UART_FULL pre-divisor latch byte.
    byte_offset: 14
    bit_size: 8
    fieldset: R8_UART_FULL_DIV
  - name: R8_UART_FULL_ADR
    description: UART_FULL slave address.
    byte_offset: 15
    bit_size: 8
    fieldset: R8_UART_FULL_ADR

