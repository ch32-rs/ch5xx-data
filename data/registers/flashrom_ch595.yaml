# Page-latch flash controller at 0x40001800, omitted from the vendor SVD.
#
# Not the serial command engine used by CH57x/58x/59x: program data goes through
# a 256-byte latch, and reads are plain memory-mapped loads.
#
# Offsets 0x04-0x06 come from the SDK's `CH59x_flash.h` only; the datasheet
# register table skips them.

block/FLASHROM:
  description: Page-latch flash controller.
  items:
  - name: PREPG_CTRL
    description: RW, pre-program mode, auto-erase and start.
    byte_offset: 0
    bit_size: 8
    fieldset: PREPG_CTRL
  - name: BUF_CTRL
    description: RW, latch clear and load control.
    byte_offset: 1
    bit_size: 8
    fieldset: BUF_CTRL
  - name: ERASE_CTRL
    description: RW, erase mode and start.
    byte_offset: 2
    bit_size: 8
    fieldset: ERASE_CTRL
  - name: PROGRAM_CTRL
    description: RW, page program start.
    byte_offset: 3
    bit_size: 8
    fieldset: PROGRAM_CTRL
  - name: RD_CTRL
    description: RW, read timing; SDK `R8_FLASH_RD_CTRL`, not in the datasheet table.
    byte_offset: 4
    bit_size: 8
  - name: LP_CTRL
    description: RW, low-power control; SDK-only, no known consumer.
    byte_offset: 5
    bit_size: 8
  - name: PREFETCH_CTRL
    description: RW, prefetch control; SDK-only, no known consumer.
    byte_offset: 6
    bit_size: 8
  - name: READ_CTRL
    description: RW, data direction, read start, clock and address auto-increment.
    byte_offset: 7
    bit_size: 8
    fieldset: READ_CTRL
  - name: RDPRCTDIS_CTRL
    description: WO, read-protect disable key; reads back the handshake state.
    byte_offset: 8
    bit_size: 8
    fieldset: RDPRCTDIS_CTRL
  - name: CHIP_STATUS
    description: R, read-protect, debug and halted state.
    byte_offset: 9
    bit_size: 8
    fieldset: CHIP_STATUS
  - name: ADDR
    description: RW, flash address; auto-increments with latch data.
    byte_offset: 12
    bit_size: 32
  - name: DATA
    description: RW, 32-bit latch data; read data when read enable is set.
    byte_offset: 16
    bit_size: 32
  - name: DATA1
    description: R, second word of an aligned read.
    byte_offset: 20
    bit_size: 32
  - name: DATA2
    description: R, third word of an aligned read.
    byte_offset: 24
    bit_size: 32
  - name: DATA3
    description: R, fourth word of an aligned read.
    byte_offset: 28
    bit_size: 32
  - name: STATUS
    description: R, controller status.
    byte_offset: 32
    bit_size: 32
    fieldset: STATUS

fieldset/PREPG_CTRL:
  description: Pre-program mode and start.
  bit_size: 8
  fields:
  - name: AUTO_EN
    description: Run the configured erase after pre-programming.
    bit_offset: 0
    bit_size: 1
  - name: MODE
    description: 0 = page, 1 = sector, 2 = bank with ADDR bit 8 selecting the page, 3 = bank.
    bit_offset: 1
    bit_size: 2
  - name: START
    bit_offset: 4
    bit_size: 1

fieldset/BUF_CTRL:
  description: Latch clear and load control.
  bit_size: 8
  fields:
  - name: CLEAR
    bit_offset: 0
    bit_size: 1
  - name: LOAD_START
    description: Start a manual latch load.
    bit_offset: 4
    bit_size: 1
  - name: LOAD_AUTO
    description: Latch each DATA write automatically.
    bit_offset: 5
    bit_size: 1

fieldset/ERASE_CTRL:
  description: Erase mode and start.
  bit_size: 8
  fields:
  - name: MODE
    description: 0 = page, 1 = sector, 2/3 = bank.
    bit_offset: 0
    bit_size: 2
  - name: START
    bit_offset: 4
    bit_size: 1

fieldset/PROGRAM_CTRL:
  description: Page program start.
  bit_size: 8
  fields:
  - name: START
    bit_offset: 0
    bit_size: 1

fieldset/READ_CTRL:
  description: Data direction, read start, clock and address auto-increment.
  bit_size: 8
  fields:
  - name: CFG_RD_EN
    description: 1 = DATA reads, 0 = DATA writes.
    bit_offset: 0
    bit_size: 1
  - name: RD_START
    description: Start a read; clears when the read finishes.
    bit_offset: 1
    bit_size: 1
  - name: AUTO_INCREMENT
    description: Advance ADDR by four words after each transfer.
    bit_offset: 2
    bit_size: 1
  - name: CLK
    description: 0 = one clock, 3 = two clocks high.
    bit_offset: 4
    bit_size: 2

fieldset/RDPRCTDIS_CTRL:
  description: Read-protect disable handshake.
  bit_size: 8
  fields:
  - name: DISABLE_FLAG
    description: Set while the disable sequence is running.
    bit_offset: 0
    bit_size: 1
  - name: DISABLE_STATE
    description: 0 = idle, 1-3 = running, 4 = done, 5 = failed.
    bit_offset: 1
    bit_size: 3
  - name: DISABLE_START
    description: 11b when 0x73 can start or 0x99 can clear the disable.
    bit_offset: 6
    bit_size: 2

fieldset/CHIP_STATUS:
  description: Chip flash state.
  bit_size: 8
  fields:
  - name: RD_PROTECT
    bit_offset: 0
    bit_size: 1
  - name: DBG_MODE
    bit_offset: 1
    bit_size: 1
  - name: FLASH_HALTED
    description: Flash access blocked by the debugger.
    bit_offset: 3
    bit_size: 1

fieldset/STATUS:
  description: Controller status.
  fields:
  - name: READY
    bit_offset: 19
    bit_size: 1
  - name: BUSY
    bit_offset: 31
    bit_size: 1
