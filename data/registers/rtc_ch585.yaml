block/RTC:
  description: Real time clock.
  items:
  - name: FLAG_CTRL
    description: RWA, Real time clock.
    byte_offset: 48
    bit_size: 8
    fieldset: FLAG_CTRL
  - name: MODE_CTRL
    description: RWA, RTC mode control, SAM.
    byte_offset: 49
    bit_size: 8
    fieldset: MODE_CTRL
  - name: TRIG
    description: RWA, RTC trigger value, SAM.
    byte_offset: 52
    fieldset: TRIG
  - name: CNT_32K
    description: RO, RTC count based 32KHz.
    byte_offset: 56
    access: Read
    bit_size: 16
    fieldset: CNT_32K
  - name: CNT_2S
    description: RO, RTC count based 2 second.
    byte_offset: 58
    access: Read
    bit_size: 16
    fieldset: CNT_2S
  - name: CNT_DAY
    description: RO, RTC count based one day, only low 14 bit.
    byte_offset: 60
    access: Read
    fieldset: CNT_DAY
fieldset/CNT_2S:
  description: RO, RTC count based 2 second.
  bit_size: 16
  fields:
  - name: CNT_2S
    description: RO, RTC count based 2 second.
    bit_offset: 0
    bit_size: 16
fieldset/CNT_32K:
  description: RO, RTC count based 32KHz.
  bit_size: 16
  fields:
  - name: CNT_32K
    description: R0,RTC count based 32KHz.
    bit_offset: 0
    bit_size: 16
fieldset/CNT_DAY:
  description: RO, RTC count based one day, only low 14 bit.
  fields:
  - name: CNT_DAY
    description: RWA,RTC count based one day.
    bit_offset: 0
    bit_size: 14
fieldset/TRIG:
  description: RWA, RTC trigger value, SAM.
  fields:
  - name: TRIG
    description: RWA, RTC trigger value.
    bit_offset: 0
    bit_size: 32
fieldset/FLAG_CTRL:
  description: RWA, Real time clock.
  bit_size: 8
  fields:
  - name: TMR_CLR
    description: RW, set 1 to clear RTC timer action flag, auto clear.
    bit_offset: 4
    bit_size: 1
  - name: TRIG_CLR
    description: RW, set 1 to clear RTC trigger action flag, auto clear.
    bit_offset: 5
    bit_size: 1
  - name: TMR_FLAG
    description: RO, RTC timer action flag.
    bit_offset: 6
    bit_size: 1
  - name: TRIG_FLAG
    description: RO, RTC trigger action flag.
    bit_offset: 7
    bit_size: 1
fieldset/MODE_CTRL:
  description: RWA, RTC mode control, SAM.
  bit_size: 8
  fields:
  - name: TMR_MODE
    description: 'RWA, RTC timer mode: 000=0.125S, 001=0.25S, 010=0.5S, 011=1S, 100=2S, 101=4S, 110=8S, 111=16S.'
    bit_offset: 0
    bit_size: 3
  - name: IGNORE_B0
    description: 'RWA, force ignore bit0 for trigger mode: 0=compare bit0, 1=ignore bit0.'
    bit_offset: 3
    bit_size: 1
  - name: TMR_EN
    description: RWA, RTC timer mode enable.
    bit_offset: 4
    bit_size: 1
  - name: TRIG_EN
    description: RWA, RTC trigger mode enable.
    bit_offset: 5
    bit_size: 1
  - name: LOAD_LO
    description: RWA, set 1 to load RTC count low word R32_RTC_CNT_32K, auto clear after loaded.
    bit_offset: 6
    bit_size: 1
  - name: LOAD_HI
    description: RWA, set 1 to load RTC count high word R32_RTC_CNT_DAY, auto clear after loaded.
    bit_offset: 7
    bit_size: 1
