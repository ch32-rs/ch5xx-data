# GPIO on CH592. The PA/PB interrupt edge-type registers (0x98, 0x9A) come from
# CH592/CH591 DS v1.9 and the SDK CH592SFR.h; the MounRiver CH59X SVD omits them.
block/GPIO:
  description: General porpose intput output.
  items:
  - name: PA_INT_EN
    description: RW, GPIO PA interrupt enable.
    byte_offset: 144
    bit_size: 16
    fieldset: PA_INT_EN
  - name: PB_INT_EN
    description: RW, GPIO PB interrupt enable.
    byte_offset: 146
    bit_size: 16
    fieldset: PB_INT_EN
  - name: PA_INT_MODE
    description: 'RW, GPIO PA interrupt mode: 0=level action, 1=edge action.'
    byte_offset: 148
    bit_size: 16
    fieldset: PA_INT_MODE
  - name: PB_INT_MODE
    description: 'RW, GPIO PB interrupt mode: 0=level action, 1=edge action;RW, status for parallel slave read.'
    byte_offset: 150
    bit_size: 16
    fieldset: PB_INT_MODE
  - name: PA_INT_EDGE_TYPE
    description: 'RW, GPIO PA interrupt edge type: 0=polarity sensitive, 1=non-polarity sensitive.'
    byte_offset: 152
    bit_size: 16
    fieldset: PA_INT_EDGE_TYPE
  - name: PB_INT_EDGE_TYPE
    description: 'RW, GPIO PB interrupt edge type: 0=polarity sensitive, 1=non-polarity sensitive.'
    byte_offset: 154
    bit_size: 16
    fieldset: PB_INT_EDGE_TYPE
  - name: PA_INT_IF
    description: RW1, GPIO PA interrupt flag.
    byte_offset: 156
    bit_size: 16
    fieldset: PA_INT_IF
  - name: PB_INT_IF
    description: RW1, GPIO PB interrupt flag.
    byte_offset: 158
    bit_size: 16
    fieldset: PB_INT_IF
  - name: PA_DIR
    description: 'RW, GPIO PA I/O direction: 0=in, 1=out.'
    byte_offset: 160
    fieldset: PA_DIR
  - name: PA_PIN
    description: RO, GPIO PA input.
    byte_offset: 164
    access: Read
    fieldset: PA_PIN
  - name: PA_OUT
    description: RW, GPIO PA output.
    byte_offset: 168
    fieldset: PA_OUT
  - name: PA_CLR
    description: 'WZ, GPIO PA clear output: 0=keep, 1=clear.'
    byte_offset: 172
    access: Write
    fieldset: PA_CLR
  - name: PA_PU
    description: RW, GPIO PA pullup resistance enable.
    byte_offset: 176
    fieldset: PA_PU
  - name: PA_PD_DRV
    description: RW, PA pulldown for input or PA driving capability for output.
    byte_offset: 180
    fieldset: PA_PD_DRV
  # CH592/CH591 DS v1.9 (Chinese), pp. 43, 47; absent from SDK/SVD.
  - name: PA_SET
    description: 'WZ, GPIO PA set output: 0=keep, 1=set high.'
    byte_offset: 184
    access: Write
    fieldset: PA_SET
  - name: PB_DIR
    description: 'RW, GPIO PB I/O direction: 0=in, 1=out.'
    byte_offset: 192
    fieldset: PB_DIR
  - name: PB_PIN
    description: RO, GPIO PB input.
    byte_offset: 196
    access: Read
    fieldset: PB_PIN
  - name: PB_OUT
    description: RW, GPIO PB output;RW, data for parallel slave read.
    byte_offset: 200
    fieldset: PB_OUT
  - name: PB_CLR
    description: 'WZ, GPIO PB clear output: 0=keep, 1=clear.'
    byte_offset: 204
    access: Write
    fieldset: PB_CLR
  - name: PB_PU
    description: RW, GPIO PB pullup resistance enable.
    byte_offset: 208
    fieldset: PB_PU
  - name: PB_PD_DRV
    description: RW, PB pulldown for input or PB driving capability for output.
    byte_offset: 212
    fieldset: PB_PD_DRV
  # CH592/CH591 DS v1.9 (Chinese), pp. 43, 48; absent from SDK/SVD.
  - name: PB_SET
    description: 'WZ, GPIO PB set output: 0=keep, 1=set high.'
    byte_offset: 216
    access: Write
    fieldset: PB_SET
