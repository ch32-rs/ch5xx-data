block/UART0:
  description: UART0 register.
  items:
  - name: R8_UART0_MCR
    description: RW, UART0 modem control.
    byte_offset: 0
    bit_size: 8
    fieldset: R8_UART0_MCR
  - name: R8_UART0_IER
    description: RW, UART0 interrupt enable.
    byte_offset: 1
    bit_size: 8
    fieldset: R8_UART0_IER
  - name: R8_UART0_FCR
    description: RW, UART0 FIFO control.
    byte_offset: 2
    bit_size: 8
    fieldset: R8_UART0_FCR
  - name: R8_UART0_LCR
    description: RW, UART0 line control.
    byte_offset: 3
    bit_size: 8
    fieldset: R8_UART0_LCR
  - name: R8_UART0_IIR
    description: RO, UART0 interrupt identification.
    byte_offset: 4
    access: Read
    bit_size: 8
    fieldset: R8_UART0_IIR
  - name: R8_UART0_LSR
    description: RO, UART0 line status.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: R8_UART0_LSR
  - name: R8_UART0_MSR
    description: RO, UART0 modem status.
    byte_offset: 6
    access: Read
    bit_size: 8
    fieldset: R8_UART0_MSR
  - name: R8_UART0_RBR
    description: RO, UART0 receiver buffer, receiving byte.
    byte_offset: 8
    access: Read
    bit_size: 8
    fieldset: R8_UART0_RBR
  - name: R8_UART0_THR
    description: WO, UART0 transmitter holding, transmittal byte.
    byte_offset: 8
    access: Write
    bit_size: 8
    fieldset: R8_UART0_THR
  - name: R8_UART0_RFC
    description: RO, UART0 receiver FIFO count.
    byte_offset: 10
    access: Read
    bit_size: 8
    fieldset: R8_UART0_RFC
  - name: R8_UART0_TFC
    description: RO, UART0 transmitter FIFO count.
    byte_offset: 11
    access: Read
    bit_size: 8
    fieldset: R8_UART0_TFC
  - name: R16_UART0_DL
    description: RW, UART0 divisor latch.
    byte_offset: 12
    bit_size: 16
    fieldset: R16_UART0_DL
  - name: R8_UART0_DIV
    description: RW, UART0 pre-divisor latch byte, only low 7 bit, from 1 to 0/128.
    byte_offset: 14
    bit_size: 8
    fieldset: R8_UART0_DIV
  - name: R8_UART0_ADR
    description: 'RW, UART0 slave address: 0xFF=disable, other=enable.'
    byte_offset: 15
    bit_size: 8
    fieldset: R8_UART0_ADR
fieldset/R16_UART0_DL:
  description: RW, UART0 divisor latch.
  bit_size: 16
  fields:
  - name: R16_UART0_DL
    description: RW, UART0 divisor latch.
    bit_offset: 0
    bit_size: 16
fieldset/R8_UART0_ADR:
  description: 'RW, UART0 slave address: 0xFF=disable, other=enable.'
  bit_size: 8
  fields:
  - name: R8_UART0_ADR
    description: 'RW,UART0 slave address: 0xFF=disable, other=enable.'
    bit_offset: 0
    bit_size: 8
fieldset/R8_UART0_DIV:
  description: RW, UART0 pre-divisor latch byte, only low 7 bit, from 1 to 0/128.
  bit_size: 8
  fields:
  - name: R8_UART0_DIV
    description: RW,UART0 pre-divisor latch byte, only low 7 bit, from 1 to 0/128.
    bit_offset: 0
    bit_size: 8
fieldset/R8_UART0_FCR:
  description: RW, UART0 FIFO control.
  bit_size: 8
  fields:
  - name: RB_FCR_FIFO_EN
    description: RW, UART FIFO enable.
    bit_offset: 0
    bit_size: 1
  - name: RB_FCR_RX_FIFO_CLR
    description: WZ, clear UART receiver FIFO, high action, auto clear.
    bit_offset: 1
    bit_size: 1
  - name: RB_FCR_TX_FIFO_CLR
    description: WZ, clear UART transmitter FIFO, high action, auto clear.
    bit_offset: 2
    bit_size: 1
  - name: RB_FCR_FIFO_TRIG
    description: 'RW, UART receiver FIFO trigger level: 00-1byte, 01-2bytes, 10-4bytes, 11-7bytes.'
    bit_offset: 6
    bit_size: 2
fieldset/R8_UART0_IER:
  description: RW, UART0 interrupt enable.
  bit_size: 8
  fields:
  - name: RB_IER_RECV_RDY
    description: RW, UART interrupt enable for receiver data ready.
    bit_offset: 0
    bit_size: 1
  - name: RB_IER_THR_EMPTY
    description: RW, UART interrupt enable for THR empty.
    bit_offset: 1
    bit_size: 1
  - name: RB_IER_LINE_STAT
    description: RW, UART interrupt enable for receiver line status.
    bit_offset: 2
    bit_size: 1
  - name: RB_IER_MODEM_CHG
    description: RW, UART0 interrupt enable for modem status change.
    bit_offset: 3
    bit_size: 1
  - name: RB_IER_DTR_EN
    description: RW, UART0 DTR/TNOW output pin enable.
    bit_offset: 4
    bit_size: 1
  - name: RB_IER_RTS_EN
    description: RW, UART0 RTS output pin enable.
    bit_offset: 5
    bit_size: 1
  - name: RB_IER_TXD_EN
    description: RW, UART TXD pin enable.
    bit_offset: 6
    bit_size: 1
  - name: RB_IER_RESET
    description: WZ, UART software reset control, high action, auto clear.
    bit_offset: 7
    bit_size: 1
fieldset/R8_UART0_IIR:
  description: RO, UART0 interrupt identification.
  bit_size: 8
  fields:
  - name: RB_IIR_NO_INT
    description: 'RO, UART no interrupt flag: 0=interrupt action, 1=no interrupt.'
    bit_offset: 0
    bit_size: 1
  - name: RB_IIR_INT_MASK
    description: RO, UART interrupt flag bit mask.
    bit_offset: 1
    bit_size: 3
  - name: RB_IIR_FIFO_ID
    description: RO, UART FIFO enabled flag.
    bit_offset: 6
    bit_size: 2
fieldset/R8_UART0_LCR:
  description: RW, UART0 line control.
  bit_size: 8
  fields:
  - name: RB_LCR_WORD_SZ
    description: 'RW, UART word bit length: 00-5bit, 01-6bit, 10-7bit, 11-8bit.'
    bit_offset: 0
    bit_size: 2
  - name: RB_LCR_STOP_BIT
    description: 'RW, UART stop bit length: 0-1bit, 1-2bit.'
    bit_offset: 2
    bit_size: 1
  - name: RB_LCR_PAR_EN
    description: RW, UART parity enable.
    bit_offset: 3
    bit_size: 1
  - name: RB_LCR_PAR_MOD
    description: 'RW, UART parity mode: 00-odd, 01-even, 10-mark, 11-space.'
    bit_offset: 4
    bit_size: 2
  - name: RB_LCR_BREAK_EN
    description: RW, UART break control enable.
    bit_offset: 6
    bit_size: 1
  - name: RB_LCR_GP_BIT__RB_LCR_DLAB
    description: RW, UART general purpose bit;RW, UART reserved bit.
    bit_offset: 7
    bit_size: 1
fieldset/R8_UART0_LSR:
  description: RO, UART0 line status.
  bit_size: 8
  fields:
  - name: RB_LSR_DATA_RDY
    description: RO, UART receiver fifo data ready status.
    bit_offset: 0
    bit_size: 1
  - name: RB_LSR_OVER_ERR
    description: RZ, UART receiver overrun error.
    bit_offset: 1
    bit_size: 1
  - name: RB_LSR_PAR_ERR
    description: RZ, UART receiver parity error.
    bit_offset: 2
    bit_size: 1
  - name: RB_LSR_FRAME_ERR
    description: RZ, UART receiver frame error.
    bit_offset: 3
    bit_size: 1
  - name: RB_LSR_BREAK_ERR
    description: RZ, UART receiver break error.
    bit_offset: 4
    bit_size: 1
  - name: RB_LSR_TX_FIFO_EMP
    description: RO, UART transmitter fifo empty status.
    bit_offset: 5
    bit_size: 1
  - name: RB_LSR_TX_ALL_EMP
    description: RO, UART transmitter all empty status.
    bit_offset: 6
    bit_size: 1
  - name: RB_LSR_ERR_RX_FIFO
    description: RO, indicate error in UART receiver fifo.
    bit_offset: 7
    bit_size: 1
fieldset/R8_UART0_MCR:
  description: RW, UART0 modem control.
  bit_size: 8
  fields:
  - name: RB_MCR_DTR
    description: RW, UART0 control DTR.
    bit_offset: 0
    bit_size: 1
  - name: RB_MCR_RTS
    description: RW, UART0 control RTS.
    bit_offset: 1
    bit_size: 1
  - name: RB_MCR_OUT1
    description: RW, UART0 control OUT1.
    bit_offset: 2
    bit_size: 1
  - name: RB_MCR_OUT2__RB_MCR_INT_OE
    description: RW, UART control OUT2/ UART interrupt output enable.
    bit_offset: 3
    bit_size: 1
  - name: RB_MCR_LOOP
    description: RW, UART0 enable local loop back.
    bit_offset: 4
    bit_size: 1
  - name: RB_MCR_AU_FLOW_EN
    description: RW, UART0 enable autoflow control.
    bit_offset: 5
    bit_size: 1
  - name: RB_MCR_TNOW
    description: RW, UART0 enable TNOW output on DTR pin.
    bit_offset: 6
    bit_size: 1
  - name: RB_MCR_HALF
    description: RW, UART0 enable half-duplex.
    bit_offset: 7
    bit_size: 1
fieldset/R8_UART0_MSR:
  description: RO, UART0 modem status.
  bit_size: 8
  fields:
  - name: RB_MSR_CTS_CHG
    description: RZ, UART0 CTS changed status, high action.
    bit_offset: 0
    bit_size: 1
  - name: RB_MSR_DSR_CHG
    description: RZ, UART0 DSR changed status, high action.
    bit_offset: 1
    bit_size: 1
  - name: RB_MSR_RI_CHG
    description: RZ, UART0 RI changed status, high action.
    bit_offset: 2
    bit_size: 1
  - name: RB_MSR_DCD_CHG
    description: RZ, UART0 DCD changed status, high action.
    bit_offset: 3
    bit_size: 1
  - name: RB_MSR_CTS
    description: RO, UART0 CTS action status.
    bit_offset: 4
    bit_size: 1
  - name: RB_MSR_DSR
    description: RO, UART0 DSR action statusv.
    bit_offset: 5
    bit_size: 1
  - name: RB_MSR_RI
    description: RO, UART0 RI action status.
    bit_offset: 6
    bit_size: 1
  - name: RB_MSR_DCD
    description: RO, UART0 DCD action status.
    bit_offset: 7
    bit_size: 1
fieldset/R8_UART0_RBR:
  description: RO, UART0 receiver buffer, receiving byte.
  bit_size: 8
  fields:
  - name: R8_UART0_RBR
    description: RO, UART0 receiver buffer, receiving byte.
    bit_offset: 0
    bit_size: 8
fieldset/R8_UART0_RFC:
  description: RO, UART0 receiver FIFO count.
  bit_size: 8
  fields:
  - name: R8_UART0_RFC
    description: RO, UART0 receiver FIFO count.
    bit_offset: 0
    bit_size: 8
fieldset/R8_UART0_TFC:
  description: RO, UART0 transmitter FIFO count.
  bit_size: 8
  fields:
  - name: R8_UART0_TFC
    description: RO, UART0 transmitter FIFO count.
    bit_offset: 0
    bit_size: 8
fieldset/R8_UART0_THR:
  description: WO, UART0 transmitter holding, transmittal byte.
  bit_size: 8
  fields:
  - name: R8_UART0_THR
    description: RO, UART0 transmitter holding, transmittal byte.
    bit_offset: 0
    bit_size: 8
