block/UART_FULL:
  description: UART register.
  items:
  - name: MCR
    description: RW, UART modem control.
    byte_offset: 0
    bit_size: 8
    fieldset: MCR
  - name: IER
    description: RW, UART interrupt enable.
    byte_offset: 1
    bit_size: 8
    fieldset: IER
  - name: FCR
    description: RW, UART FIFO control.
    byte_offset: 2
    bit_size: 8
    fieldset: FCR
  - name: LCR
    description: RW, UART line control.
    byte_offset: 3
    bit_size: 8
    fieldset: LCR
  - name: IIR
    description: RO, UART interrupt identification.
    byte_offset: 4
    access: Read
    bit_size: 8
    fieldset: IIR
  - name: LSR
    description: RO, UART line status.
    byte_offset: 5
    access: Read
    bit_size: 8
    fieldset: LSR
  - name: RBR
    description: RO, UART receiver buffer, receiving byte.
    byte_offset: 8
    access: Read
    bit_size: 8
    fieldset: RBR
  - name: THR
    description: WO, UART transmitter holding, transmittal byte.
    byte_offset: 8
    access: Write
    bit_size: 8
    fieldset: THR
  - name: RFC
    description: RO, UART receiver FIFO count.
    byte_offset: 10
    access: Read
    bit_size: 8
    fieldset: RFC
  - name: TFC
    description: RO, UART transmitter FIFO count.
    byte_offset: 11
    access: Read
    bit_size: 8
    fieldset: TFC
  - name: DL
    description: RW, UART divisor latch.
    byte_offset: 12
    bit_size: 16
    fieldset: DL
  - name: DIV
    description: RW, UART pre-divisor latch byte, only low 7 bit, from 1 to 128.
    byte_offset: 14
    bit_size: 8
    fieldset: DIV
fieldset/DL:
  description: RW, UART divisor latch.
  bit_size: 16
  fields:
  - name: DL
    description: RW, UART divisor latch.
    bit_offset: 0
    bit_size: 16
fieldset/DIV:
  description: RW, UART pre-divisor latch byte, only low 7 bit, from 1 to 128.
  bit_size: 8
  fields:
  - name: DIV
    description: RW, UART pre-divisor latch byte, only low 7 bit, from 1 to 128.
    bit_offset: 0
    bit_size: 8
fieldset/FCR:
  description: RW, UART FIFO control.
  bit_size: 8
  fields:
  - name: FCR_FIFO_EN
    description: RW, UART FIFO enable.
    bit_offset: 0
    bit_size: 1
  - name: FCR_FIFO_TRIG
    description: 'RW, UART receiver FIFO trigger level: 00-1byte, 01-2bytes, 10-4bytes, 11-7bytes.'
    bit_offset: 6
    bit_size: 2
fieldset/IER:
  description: RW, UART interrupt enable.
  bit_size: 8
  fields:
  - name: IER_RECV_RDY
    description: RW, UART interrupt enable for receiver data ready.
    bit_offset: 0
    bit_size: 1
  - name: IER_THR_EMPTY
    description: RW, UART interrupt enable for THR empty.
    bit_offset: 1
    bit_size: 1
  - name: IER_LINE_STAT
    description: RW, UART interrupt enable for receiver line status.
    bit_offset: 2
    bit_size: 1
  - name: IER_TXD_EN
    description: RW, UART TXD pin enable.
    bit_offset: 6
    bit_size: 1
fieldset/IIR:
  description: RO, UART interrupt identification.
  bit_size: 8
  fields:
  - name: IIR_NO_INT
    description: 'RO, UART no interrupt flag: 0=interrupt action, 1=no interrupt.'
    bit_offset: 0
    bit_size: 1
  - name: IIR_INT_MASK
    description: RO, UART interrupt flag bit mask.
    bit_offset: 1
    bit_size: 3
  - name: IIR_FIFO_ID
    description: RO, UART FIFO enabled flag.
    bit_offset: 6
    bit_size: 2
fieldset/LCR:
  description: RW, UART line control.
  bit_size: 8
  fields:
  - name: LCR_WORD_SZ
    description: 'RW, UART word bit length: 00-5bit, 01-6bit, 10-7bit, 11-8bit.'
    bit_offset: 0
    bit_size: 2
  - name: LCR_STOP_BIT
    description: 'RW, UART stop bit length: 0-1bit, 1-2bit.'
    bit_offset: 2
    bit_size: 1
  - name: LCR_PAR_EN
    description: RW, UART parity enable.
    bit_offset: 3
    bit_size: 1
  - name: LCR_PAR_MOD
    description: 'RW, UART parity mode: 00-odd, 01-even, 10-mark, 11-space.'
    bit_offset: 4
    bit_size: 2
  - name: LCR_BREAK_EN
    description: RW, UART break control enable.
    bit_offset: 6
    bit_size: 1
  - name: LCR_GP_BIT__LCR_DLAB
    description: RW, UART general purpose bit;RW, UART reserved bit.
    bit_offset: 7
    bit_size: 1
fieldset/LSR:
  description: RO, UART line status.
  bit_size: 8
  fields:
  - name: LSR_DATA_RDY
    description: RO, UART receiver fifo data ready status.
    bit_offset: 0
    bit_size: 1
  - name: LSR_OVER_ERR
    description: RZ, UART receiver overrun error.
    bit_offset: 1
    bit_size: 1
  - name: LSR_PAR_ERR
    description: RZ, UART receiver parity error.
    bit_offset: 2
    bit_size: 1
  - name: LSR_FRAME_ERR
    description: RZ, UART receiver frame error.
    bit_offset: 3
    bit_size: 1
  - name: LSR_BREAK_ERR
    description: RZ, UART receiver break error.
    bit_offset: 4
    bit_size: 1
  - name: LSR_TX_FIFO_EMP
    description: RO, UART transmitter fifo empty status.
    bit_offset: 5
    bit_size: 1
  - name: LSR_TX_ALL_EMP
    description: RO, UART transmitter all empty status.
    bit_offset: 6
    bit_size: 1
  - name: LSR_ERR_RX_FIFO
    description: RO, indicate error in UART receiver fifo.
    bit_offset: 7
    bit_size: 1
fieldset/MCR:
  description: RW, UART modem control.
  bit_size: 8
  fields:
  - name: MCR_OUT2__MCR_INT_OE
    description: RW, UART control OUT2/UART interrupt output enable.
    bit_offset: 3
    bit_size: 1
fieldset/RBR:
  description: RO, UART receiver buffer, receiving byte.
  bit_size: 8
  fields:
  - name: RBR
    description: RO, UART receiver buffer, receiving byte.
    bit_offset: 0
    bit_size: 8
fieldset/RFC:
  description: RO, UART receiver FIFO count.
  bit_size: 8
  fields:
  - name: RFC
    description: RO, UART receiver FIFO count.
    bit_offset: 0
    bit_size: 8
fieldset/TFC:
  description: RO, UART transmitter FIFO count.
  bit_size: 8
  fields:
  - name: TFC
    description: RO, UART receiver FIFO count.
    bit_offset: 0
    bit_size: 8
fieldset/THR:
  description: WO, UART transmitter holding, transmittal byte.
  bit_size: 8
  fields:
  - name: RBR
    description: WO, UART transmitter holding, transmittal byte.
    bit_offset: 0
    bit_size: 8
