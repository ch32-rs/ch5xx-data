# CH569, from openwch/ch569 EVT (Link.ld) and product docs. QingKe V3A,
# USB3.0 SS / HS, ETH, EMMC, SerDes, HSPI. CH565 shares the register map
# (package / feature packaging differs).
#
# Flash: 448KB code @ 0. Data flash 32KB is quoted in marketing/docs; Link.ld
# only maps the 448KB code region, so DATAFLASH is recorded at 0x70000 like
# the other CH5xx parts. SRAM: RAMS 16KB @ 0x20000000 + RAMX 96KB window @
# 0x20020000 (default ld uses 32KB of RAMX; SFR allows up to 96KB).
# Chip id byte = 0x69.
name: CH569
family: QingKe RISC-V-based MCU
subfamily: USB3.0 Super-Speed Interface MCU
product_type: QingKe V3A core
packages:
  - name: CH569W
    package: QFN68
    device_id: 0x69000000
memory:
  - name: CODEFLASH
    kind: flash
    address: 0
    size: 448K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 4
  - name: DATAFLASH
    kind: flash
    address: 0x70000
    size: 32K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 1
  - name: RAMS
    kind: ram
    address: 0x20000000
    size: 16K
  - name: RAMX
    kind: ram
    address: 0x20020000
    size: 96K
docs:
  - type: homepage
    title: CH569 product page
    name: ""
    url: https://www.wch.cn/products/CH569.html
cores:
  - name: qingke-v3a
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH569.yaml"
    include_interrupts: "../interrupts/CH569.yaml"
