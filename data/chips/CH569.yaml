# CH569, from openwch/ch569 EVT (Link.ld) and product docs. QingKe V3A.
# CH569DS1 V1.3 confirms 448K/32K flash, 96K RAMX + 16K RAMS, QFN68.
# CH565 shares this register map. Chip id byte = 0x69.
name: CH569
family: QingKe RISC-V-based MCU
subfamily: USB3.0 Super-Speed Interface MCU
product_type: QingKe V3A core
packages:
  - name: CH569W
    package: QFN68
    device_id: 0x69000000
memory:
  - name: CODEFLASH
    kind: flash
    address: 0
    size: 448K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 4
  - name: DATAFLASH
    kind: flash
    address: 0x70000
    size: 32K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 1
  - name: RAMS
    kind: ram
    address: 0x20000000
    size: 16K
  - name: RAMX
    kind: ram
    address: 0x20020000
    size: 96K
docs:
  - type: homepage
    title: CH569 product page
    name: ""
    url: https://www.wch.cn/products/CH569.html
cores:
  - name: qingke-v3a
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH569.yaml"
    include_interrupts: "../interrupts/CH569.yaml"
