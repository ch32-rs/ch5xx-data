# CH564, from Studio EVT (ISP564.h, Link.ld, Core/core_riscv.h). QingKe V4J.
# Flash+RAM is reconfigurable (GLOB_MEM_CFG); default models the full 192KB
# CODEFLASH window + DATAFLASH 32KB @ 0x30000 + SRAM 64K. Packages from Studio
# templates; GetCHIPID quotes 0x564x05x8 — use 0x64000000 as the package device_id.
name: CH564
family: QingKe RISC-V-based MCU
subfamily: 480Mbps Hi-Speed USB and 100M Ethernet MCU
product_type: QingKe V4J core
packages:
  - name: CH564C
    package: QFN28
    device_id: 0x64000000
  - name: CH564F
    package: QFN48
    device_id: 0x64000000
  - name: CH564L
    package: LQFP128
    device_id: 0x64000000
  - name: CH564Q
    package: LQFP64
    device_id: 0x64000000
memory:
  - name: CODEFLASH
    kind: flash
    address: 0
    size: 192K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 4
  - name: DATAFLASH
    kind: flash
    address: 0x30000
    size: 32K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 1
  - name: SRAM
    kind: ram
    address: 0x20000000
    size: 64K
docs:
  - type: homepage
    title: CH564 product page
    name: ""
    url: https://www.wch.cn/products/CH564.html
cores:
  - name: qingke-v4j
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH564.yaml"
    include_interrupts: "../interrupts/CH564.yaml"
