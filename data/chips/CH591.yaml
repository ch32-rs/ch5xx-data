# CH591, from the MounRiver CH59X SDK rather than a datasheet: none was
# available. The CH591 templates ship the CH592 SFR header and ISP library
# unchanged and only the linker script differs, cutting the code flash from
# 448KB to 192KB. SRAM stays 26KB. The CH592 header reads ID_CH591 = 0x91.
#
# Flash geometry follows ISP592.h, the same as CH592: code erased in 4KB blocks
# and programmed a dword at a time. The 32KB data flash that header describes
# has no address in the SDK, so it is not mapped here.
name: CH591
family: QingKe RISC-V-based, BLE MCU
subfamily: RISC-V Core BLE Wireless MCU
product_type: QingKe V3C core, BLE
packages:
  - name: CH591D
    package: QFN20
    device_id: 0x91000000
  - name: CH591F
    package: QFN28
    device_id: 0x91000000
  - name: CH591R
    package: TSSOP16
    device_id: 0x91000000
memory:
  - name: CODEFLASH
    kind: flash
    address: 0
    size: 192K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 4
  - name: SRAM
    kind: ram
    address: 0x20000000
    size: 26K
docs:
  - type: homepage
    title: CH591 product page
    name: ""
    url: https://www.wch.cn/products/CH591.html
cores:
  - name: qingke-v3c
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH59X.yaml"
    include_interrupts: "../interrupts/CH59X.yaml"
