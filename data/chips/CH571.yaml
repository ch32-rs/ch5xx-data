# CH571, from the MounRiver CH57X SDK. Same SFR/ISP/startup as CH573; Link.ld
# cuts code flash to 192KB. Chip id byte ID_CH571 = 0x71. Family and interrupts
# reuse the CH573 files (full SVD map) until a datasheet justifies cuts.
name: CH571
family: QingKe RISC-V-based, BLE MCU
subfamily: RISC-V Core BLE4.2 Wireless MCU
product_type: QingKe V3A core, BLE
packages:
  - name: CH571F
    package: QFN28
    device_id: 0x71000000
  - name: CH571D
    package: QFN20
    device_id: 0x71000000
  - name: CH571K
    package: ESSOP10
    device_id: 0x71000000
  - name: CH571R
    package: TSSOP16
    device_id: 0x71000000
memory:
  - name: CODEFLASH
    kind: flash
    address: 0
    size: 192K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 4
  - name: DATAFLASH
    kind: flash
    address: 0x70000
    size: 32K
    modes:
      - type: standard
        erase_size: 256
        write_size: 1
  - name: SRAM
    kind: ram
    address: 0x20003800
    size: 18K
docs:
  - type: homepage
    title: CH573 product page
    name: ""
    url: https://www.wch.cn/products/CH573.html
cores:
  - name: qingke-v3a
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH573.yaml"
    include_interrupts: "../interrupts/CH573.yaml"
