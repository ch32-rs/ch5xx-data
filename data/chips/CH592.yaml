# CH592, from the MounRiver CH59X SDK rather than a datasheet: none was
# available. The CH592F and CH592X linker scripts both give 448KB of code and
# 26KB of SRAM, and ISP592.h, which the CH591 templates ship unchanged, gives
# the flash geometry: code erased in 4KB blocks and programmed a dword at a
# time, data 32KB erased in 256B pages and programmed a byte at a time, both
# through the ISP library. The data region's address is not stated anywhere in
# the SDK, so it is not mapped here.
#
# The CH592 SFR header reads ID_CH592 = 0x92. Packages follow the SDK
# templates, which stop at the package letter.
name: CH592
family: QingKe RISC-V-based, BLE MCU
subfamily: RISC-V Core BLE Wireless MCU
product_type: QingKe V3C core, BLE
packages:
  - name: CH592D
    package: QFN20
    device_id: 0x92000000
  - name: CH592F
    package: QFN28
    device_id: 0x92000000
  - name: CH592X
    package: QFN32
    device_id: 0x92000000
memory:
  - name: CODEFLASH
    kind: flash
    address: 0
    size: 448K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 4
  - name: SRAM
    kind: ram
    address: 0x20000000
    size: 26K
docs:
  - type: homepage
    title: CH592 product page
    name: ""
    url: https://www.wch.cn/products/CH592.html
cores:
  - name: qingke-v3c
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH592.yaml"
    include_interrupts: "../interrupts/CH592.yaml"
