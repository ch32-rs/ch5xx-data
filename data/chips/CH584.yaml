# CH584, from CH585/CH584 datasheet V1.6. The datasheet states the difference in
# one line: CH584 drops the USBHS and SPI1 modules and has 96KB of SRAM.
# Everything else, LCD included, is shared with CH585, so the register blocks
# are the CH585 ones. See data/family/CH584.yaml.
#
# Flash geometry is the same as CH585 (table 2-2-1): code erased in 4KB blocks
# and programmed a dword at a time, data erased in 256B pages and programmed a
# byte at a time, both through the ISP library. CH584X differs in flash size and
# is described in its own file.
#
# The chip id byte is 0x92 (R8_CHIP_ID, datasheet section 3).
name: CH584
family: QingKe RISC-V-based, BLE MCU
subfamily: RISC-V Core BLE5.4 Wireless MCU
product_type: QingKe V3C core, BLE
packages:
  - name: CH584M
    package: QFN48
    device_id: 0x84000000
  - name: CH584F
    package: QFN32
    device_id: 0x84000000
memory:
  - name: CODEFLASH
    kind: flash
    address: 0
    size: 448K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 4
  - name: DATAFLASH
    kind: flash
    address: 0x70000
    size: 32K
    modes:
      - type: standard
        erase_size: 256
        write_size: 1
  - name: SRAM
    kind: ram
    address: 0x20000000
    size: 96K
docs:
  - type: datasheet
    title: CH585/CH584 datasheet
    name: CH585DS1 V1.6
    url: https://www.wch.cn/downloads/CH585DS1_PDF.html
cores:
  - name: qingke-v3c
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH584.yaml"
    include_interrupts: "../interrupts/CH584.yaml"
