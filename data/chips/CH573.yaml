# CH573, from the MounRiver CH57X SDK (CH573SFR.h, ISP573.h, CH573X Link.ld).
# QingKe V3A, BLE 4.2. CH571 shares this register map (192KB flash). Chip id
# byte ID_CH573 = 0x73.
name: CH573
family: QingKe RISC-V-based, BLE MCU
subfamily: RISC-V Core BLE4.2 Wireless MCU
product_type: QingKe V3A core, BLE
packages:
  - name: CH573X
    package: QFN32
    device_id: 0x73000000
  - name: CH573F
    package: QFN28
    device_id: 0x73000000
  - name: CH573Q
    package: LQFP32
    device_id: 0x73000000
memory:
  - name: CODEFLASH
    kind: flash
    address: 0
    size: 448K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 4
  - name: DATAFLASH
    kind: flash
    address: 0x70000
    size: 32K
    modes:
      - type: standard
        erase_size: 256
        write_size: 1
  - name: SRAM
    kind: ram
    address: 0x20003800
    size: 18K
docs:
  - type: homepage
    title: CH573 product page
    name: ""
    url: https://www.wch.cn/products/CH573.html
cores:
  - name: qingke-v3a
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH573.yaml"
    include_interrupts: "../interrupts/CH573.yaml"
