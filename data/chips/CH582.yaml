# CH582, from CH583/CH582 datasheet V1.9 and the MounRiver CH58X SDK.
# Same flash/SRAM and SFR set as CH583, but without SPI1. Register blocks
# and interrupts are the CH583 ones; only the family list drops SPI1.
#
# Chip id byte ID_CH582 = 0x82. Packages follow the SDK templates.
name: CH582
family: QingKe RISC-V-based, BLE MCU
subfamily: RISC-V Core BLE5.0 Wireless MCU
product_type: QingKe V4A core, BLE
packages:
  - name: CH582M
    package: QFN48
    device_id: 0x82000000
  - name: CH582F
    package: QFN28
    device_id: 0x82000000
memory:
  - name: CODEFLASH
    kind: flash
    address: 0
    size: 448K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 4
  - name: DATAFLASH
    kind: flash
    address: 0x70000
    size: 32K
    modes:
      - type: standard
        erase_size: 256
        write_size: 1
  - name: SRAM
    kind: ram
    address: 0x20000000
    size: 32K
docs:
  - type: datasheet
    title: CH583/CH582 datasheet
    name: CH583DS1 V1.9
    url: https://www.wch.cn/downloads/CH583DS1_PDF.html
cores:
  - name: qingke-v4a
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH582.yaml"
    include_interrupts: "../interrupts/CH583.yaml"
