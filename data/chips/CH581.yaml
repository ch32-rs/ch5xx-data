# CH581, from the CH581 SFR header shipped in the MounRiver CH585 SDK
# (CH581SFR.h) and the CH581M linker script. It is the CH585 die with SPI1,
# USBHS and LCD removed and 96KB of SRAM. The CH585 datasheet does not mention
# CH581; it describes CH584 as dropping only USBHS and SPI1, so the two are not
# the same cut and CH581 keeps its own peripheral list.
#
# Flash geometry is identical to CH585. The header defines the same constants
# (448KB code, 32KB data, 4KB code erase, dword programming, 256B data erase,
# byte programming) and the same ISP library gates it.
#
# The IDE only ships a CH581M template. The chip id byte in the header is
# ID_CH581 = 0x92.
name: CH581
family: QingKe RISC-V-based, BLE MCU
subfamily: RISC-V Core BLE5.4 Wireless MCU
product_type: QingKe V3C core, BLE
packages:
  - name: CH581M
    package: QFN48
    device_id: 0x81000000
memory:
  - name: CODEFLASH
    kind: flash
    address: 0
    size: 448K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 4
  - name: DATAFLASH
    kind: flash
    address: 0x70000
    size: 32K
    modes:
      - type: standard
        erase_size: 256
        write_size: 1
  - name: SRAM
    kind: ram
    address: 0x20000000
    size: 96K
docs:
  - type: datasheet
    title: CH585/CH584 datasheet
    name: CH585DS1 V1.6
    url: https://www.wch.cn/downloads/CH585DS1_PDF.html
cores:
  - name: qingke-v3c
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH581.yaml"
    include_interrupts: "../interrupts/CH581.yaml"
