# CH565, same EVT/SFR map as CH569. Packages QFN68/QFN40. Chip id byte = 0x65.
# Family and interrupts reuse the CH569 files.
name: CH565
family: QingKe RISC-V-based MCU
subfamily: USB3.0 Super-Speed Interface MCU
product_type: QingKe V3A core
packages:
  - name: CH565W
    package: QFN68
    device_id: 0x65000000
  - name: CH565M
    package: QFN40
    device_id: 0x65000000
memory:
  - name: CODEFLASH
    kind: flash
    address: 0
    size: 448K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 4
  - name: DATAFLASH
    kind: flash
    address: 0x70000
    size: 32K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 1
  - name: RAMS
    kind: ram
    address: 0x20000000
    size: 16K
  - name: RAMX
    kind: ram
    address: 0x20020000
    size: 96K
docs:
  - type: homepage
    title: CH569 product page
    name: ""
    url: https://www.wch.cn/products/CH569.html
cores:
  - name: qingke-v3a
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH569.yaml"
    include_interrupts: "../interrupts/CH569.yaml"
