name: metapac build

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "*.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use nightly Rust
        run: |
          rustup default nightly
          rustup target add riscv32imc-unknown-none-elf
      - name: Build
        run: |
          ./d gen
      - name: Test
        run: |
          cd build/ch5xx-metapac/
          cargo build --features pac,metadata,rt,memory-x,ch585 --target riscv32imc-unknown-none-elf
          cargo doc --features pac,metadata,rt,memory-x,ch585 --target riscv32imc-unknown-none-elf
      - name: Unit tests (host)
        run: |
          cd build/ch5xx-metapac/
          cargo test --features metadata,ch585
