name: metapac publish

on:
  push:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'ch32-rs/ch5xx-data' }}
    steps:
      - uses: actions/checkout@v4
      - name: Use nightly Rust
        run: |
          rustup default nightly
          rustup component add rustfmt
      - name: Deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NIGHTLIES_KEY }}" > ~/.ssh/id_rsa
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
      - name: Build
        run: |
          COMMIT=$(git rev-parse HEAD)
          mkdir -p build
          git clone --depth 1 git@github.com:ch32-rs/ch5xx-metapac.git build/ch5xx-metapac/
          ./d gen
          cd build/ch5xx-metapac/
          cp -v ../../ch5xx-metapac-gen/res/README.md .
          cp -v ../../LICENSE* .
          find src -iname '*.rs' -exec rustfmt -v {} \;
          git add .
          git config user.name "ch5xx-data builder"
          git config user.email "action@github.com"
          git commit -m "ch32-rs/ch5xx-data master $COMMIT" --allow-empty
          git tag -a ch5xx-data-$COMMIT -m "Generated from ch5xx-data $COMMIT"
      - name: Test
        run: |
          cd build/ch5xx-metapac/
          cargo doc --features ch585,metadata
      - name: Push
        run: |
          cd build/ch5xx-metapac/
          git push origin main --follow-tags
